  /**
   * Détecte le document sur un canvas/image.
   * @returns {{quad:{tl,tr,br,bl}, areaFrac:number}|null} quad normalisé (0..1)
   */
  detectQuad(canvas) {
    try {
      const { g, w, h } = this._gray(canvas, 520);
      const blur = this._boxBlur(g, w, h, 2);
      const mag = this._sobel(blur, w, h);

      let maxMag = 0;
      for (let i = 0; i < mag.length; i++) if (mag[i] > maxMag) maxMag = mag[i];
      if (maxMag < 8) return null;                     // image trop uniforme

      const hist = new Uint32Array(256);
      const k = 255 / maxMag;
      for (let i = 0; i < mag.length; i++) hist[Math.min(255, Math.round(mag[i] * k))]++;
      const otsu = this._otsu(hist, w * h) / k;

      let best = null;
      // plusieurs seuils : on garde le meilleur quadrilatère plausible
      for (const factor of [1, 0.75, 1.4]) {
        const thr = Math.max(10, otsu * factor);
        let edges = new Uint8Array(w * h);
        for (let i = 0; i < mag.length; i++) edges[i] = mag[i] > thr ? 1 : 0;
        edges = this._dilate(edges, w, h);
        edges = this._dilate(edges, w, h);
        const res = this._quadFromEdges(edges, w, h);
        if (!res || !this._quadValid(res.quad)) continue;
        if (res.areaFrac > 0.985) continue;             // cadre entier : rien à corriger
        const score = res.areaFrac * (factor === 1 ? 1.15 : 1);
        if (!best || score > best.score) best = { quad: res.quad, areaFrac: res.areaFrac, score };
      }
      if (!best) return null;
      return { quad: this._orderQuad(best.quad), areaFrac: best.areaFrac };
    } catch (e) {
      console.warn('[Vision] detectQuad', e);
      return null;
    }
  },

  /** Force l'ordre TL, TR, BR, BL (par angle autour du centre). */
  _orderQuad(q) {
    const cx = (q.tl.x + q.tr.x + q.br.x + q.bl.x) / 4;
    const cy = (q.tl.y + q.tr.y + q.br.y + q.bl.y) / 4;
    const pts = [q.tl, q.tr, q.br, q.bl]
      .map(p => ({ x: p.x, y: p.y, a: Math.atan2(p.y - cy, p.x - cx) }))
      .sort((p, r) => p.a - r.a);
    // le premier point est celui de plus petit angle : on décale pour partir du haut-gauche
    let start = 0, bestSum = Infinity;
    pts.forEach((p, i) => { const s = p.x + p.y; if (s < bestSum) { bestSum = s; start = i; } });
    const r = [pts[start], pts[(start + 1) % 4], pts[(start + 2) % 4], pts[(start + 3) % 4]];
    return {
      tl: { x: r[0].x, y: r[0].y }, tr: { x: r[1].x, y: r[1].y },
      br: { x: r[2].x, y: r[2].y }, bl: { x: r[3].x, y: r[3].y }
    };
  },

  /* ------------------------------------------------------------- warp 4 pts -- */

  /** Résolution d'un système linéaire n×n (pivot partiel). */
  _solve(A, b, n) {
    for (let i = 0; i < n; i++) {
      let p = i;
      for (let r = i + 1; r < n; r++) if (Math.abs(A[r][i]) > Math.abs(A[p][i])) p = r;
      if (Math.abs(A[p][i]) < 1e-12) return null;
      if (p !== i) { const t = A[p]; A[p] = A[i]; A[i] = t; const tb = b[p]; b[p] = b[i]; b[i] = tb; }
      const piv = A[i][i];
      for (let r = i + 1; r < n; r++) {
        const f = A[r][i] / piv;
        if (!f) continue;
        for (let c = i; c < n; c++) A[r][c] -= f * A[i][c];
        b[r] -= f * b[i];
      }
    }
    const x = new Array(n).fill(0);
    for (let i = n - 1; i >= 0; i--) {
      let s = b[i];
      for (let c = i + 1; c < n; c++) s -= A[i][c] * x[c];
      x[i] = s / A[i][i];
    }
    return x;
  },

  /** Homographie qui envoie src[i] sur dst[i] (i = 0..3). Retourne [a,b,c,d,e,f,g,h]. */
  _homography(src, dst) {
    const A = [], b = [];
    for (let i = 0; i < 4; i++) {
      const { x, y } = src[i], { x: u, y: v } = dst[i];
      A.push([x, y, 1, 0, 0, 0, -x * u, -y * u]); b.push(u);
      A.push([0, 0, 0, x, y, 1, -x * v, -y * v]); b.push(v);
    }
    return this._solve(A, b, 8);
  },

  /**
   * Corrige la perspective : le quadrilatère `quad` (normalisé) devient un
   * rectangle droit. `quad` est exprimé dans le repère du canvas source.
   */
  warp(srcCanvas, quad, { maxPx = 2400 } = {}) {
    const W = srcCanvas.width, H = srcCanvas.height;
    const P = [
      { x: quad.tl.x * W, y: quad.tl.y * H },
      { x: quad.tr.x * W, y: quad.tr.y * H },
      { x: quad.br.x * W, y: quad.br.y * H },
      { x: quad.bl.x * W, y: quad.bl.y * H }
    ];
    const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
    const wTop = dist(P[0], P[1]), wBottom = dist(P[3], P[2]);
    const hLeft = dist(P[0], P[3]), hRight = dist(P[1], P[2]);
    let outW = Math.max(8, Math.round(Math.max(wTop, wBottom)));
    let outH = Math.max(8, Math.round(Math.max(hLeft, hRight)));
    const k = Math.min(1, maxPx / Math.max(outW, outH));
    outW = Math.max(8, Math.round(outW * k));
    outH = Math.max(8, Math.round(outH * k));

    // inverse : de la sortie (rectangle) vers la source (quad)
    const dstPts = [{ x: 0, y: 0 }, { x: outW, y: 0 }, { x: outW, y: outH }, { x: 0, y: outH }];
    const M = this._homography(dstPts, P);
    if (!M || M.some(v => !isFinite(v))) return srcCanvas;
    const [a, b, c, d, e, f, g2, h2] = M;

    const src = srcCanvas.getContext('2d', { willReadFrequently: true }).getImageData(0, 0, W, H).data;
    const outCanvas = document.createElement('canvas');
    outCanvas.width = outW; outCanvas.height = outH;
    const outCtx = outCanvas.getContext('2d');
    const outImg = outCtx.createImageData(outW, outH);
    const o = outImg.data;

    for (let y = 0; y < outH; y++) {
      let nu = c + b * y, nv = f + e * y, den = 1 + h2 * y;
      const du = a, dv = d, dden = g2;
      for (let x = 0; x < outW; x++) {
        const u = nu / den, v = nv / den;
        nu += du; nv += dv; den += dden;
        const oi = (y * outW + x) * 4;
        if (u < 0 || v < 0 || u > W - 1 || v > H - 1) {
          o[oi] = o[oi + 1] = o[oi + 2] = 255; o[oi + 3] = 255;
          continue;
        }
        const x0 = u | 0, y0 = v | 0;
        const x1 = Math.min(W - 1, x0 + 1), y1 = Math.min(H - 1, y0 + 1);
        const fx = u - x0, fy = v - y0;
        const i00 = (y0 * W + x0) * 4, i10 = (y0 * W + x1) * 4;
        const i01 = (y1 * W + x0) * 4, i11 = (y1 * W + x1) * 4;
        const w00 = (1 - fx) * (1 - fy), w10 = fx * (1 - fy), w01 = (1 - fx) * fy, w11 = fx * fy;
        o[oi]     = src[i00] * w00 + src[i10] * w10 + src[i01] * w01 + src[i11] * w11;
        o[oi + 1] = src[i00 + 1] * w00 + src[i10 + 1] * w10 + src[i01 + 1] * w01 + src[i11 + 1] * w11;
        o[oi + 2] = src[i00 + 2] * w00 + src[i10 + 2] * w10 + src[i01 + 2] * w01 + src[i11 + 2] * w11;
        o[oi + 3] = 255;
      }
    }
    outCtx.putImageData(outImg, 0, 0);
    return outCanvas;
  },

  /* ---------------------------------------------------------------- deskew -- */

  /** Angle (degrés) qui redresse le mieux les lignes de texte, ou 0. */
  acceptQuad(det, source = 'camera') {
    if (!det || !det.quad || !this._quadValid(det.quad)) return false;
    const q = det.quad, area = det.areaFrac || this.quadArea(q);
    const lim = source === 'import' ? 0.32 : 0.48;
    const cornersNear = q.tl.x <= lim && q.tl.y <= lim && q.tr.x >= 1-lim && q.tr.y <= lim && q.br.x >= 1-lim && q.br.y >= 1-lim && q.bl.x <= lim && q.bl.y >= 1-lim;
    if (!cornersNear) return false;
    if (source === 'import' && (area < 0.50 || area > 0.985)) return false;
    if (source !== 'import' && (area < 0.28 || area > 0.99)) return false;
    return true;
  },
  deskewAngle(canvas, opts = {}) { return this.deskewAngleDetailed(canvas, opts).angle; },
  deskewAngleDetailed(canvas, { maxAngle = 10, step = 0.5 } = {}) {
    try {
      const { g, w, h } = this._gray(canvas, 480);
      const hist = new Uint32Array(256);
      for (let i = 0; i < g.length; i++) hist[Math.min(255, g[i] | 0)]++;
      const thr = this._otsu(hist, w * h);
      // masque du texte (pixels sombres)
      const bin = new Uint8Array(w * h);
      let ink = 0;
      for (let i = 0; i < g.length; i++) if (g[i] < thr) { bin[i] = 1; ink++; }
      if (ink < w * h * 0.002 || ink > w * h * 0.6) return { angle: 0, improvement: 0, score: 0 };   // pas de texte net

      const cx = w / 2, cy = h / 2;
      let bestAngle = 0, bestScore = -1; const scores = [];
      for (let a = -maxAngle; a <= maxAngle + 1e-9; a += step) {
        const rad = a * Math.PI / 180;
        const cos = Math.cos(rad), sin = Math.sin(rad);
        const rows = new Float32Array(h);
        for (let y = 0; y < h; y++) {
          const dy = y - cy;
          let sum = 0;
          for (let x = 0; x < w; x++) {
            const dx = x - cx;
            const sx = Math.round(cx + dx * cos - dy * sin);
            const sy = Math.round(cy + dx * sin + dy * cos);
            if (sx < 0 || sy < 0 || sx >= w || sy >= h) continue;
            sum += bin[sy * w + sx];
          }
          rows[y] = sum;
        }
        // variance des projections : maximale quand les lignes s'alignent
        let mean = 0;
        for (let y = 0; y < h; y++) mean += rows[y];
        mean /= h;
        let varr = 0;
        for (let y = 0; y < h; y++) { const d2 = rows[y] - mean; varr += d2 * d2; }
        scores.push({ a, varr });
        if (varr > bestScore) { bestScore = varr; bestAngle = a; }
      }
      const zero = scores.reduce((acc, x) => Math.abs(x.a) < Math.abs(acc.a) ? x : acc, scores[0] || { varr: 0 });
      const improvement = zero.varr > 0 ? (bestScore - zero.varr) / zero.varr : 0;
      const angle = (Math.abs(bestAngle) < 0.6 || improvement < 0.08) ? 0 : Math.round(bestAngle * 10) / 10;
      return { angle, improvement, score: bestScore };
    } catch (e) {
      console.warn('[Vision] deskew', e);
      return 0;
    }
  },

  /** Applique une petite rotation et recadre au plus grand rectangle inscrit. */
  rotate(srcCanvas, deg, { maxPx = 2400 } = {}) {
    if (!deg) return srcCanvas;
    const W = srcCanvas.width, H = srcCanvas.height;
    const rad = deg * Math.PI / 180;
    const cos = Math.cos(rad), sin = Math.sin(rad);
    const s = Math.min(W / (W * Math.abs(cos) + H * Math.abs(sin)),
                         H / (H * Math.abs(cos) + W * Math.abs(sin)));
    const outW = Math.max(8, Math.round(W * s));
    const outH = Math.max(8, Math.round(H * s));
    const c = document.createElement('canvas');
    c.width = outW; c.height = outH;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, outW, outH);
    ctx.imageSmoothingQuality = 'high';
    ctx.translate(outW / 2, outH / 2);
    ctx.rotate(rad);
    ctx.drawImage(srcCanvas, -W / 2, -H / 2);
    const k = Math.min(1, maxPx / Math.max(outW, outH));
    if (k < 1) {
      const c2 = document.createElement('canvas');
      c2.width = Math.round(outW * k); c2.height = Math.round(outH * k);
      c2.getContext('2d').drawImage(c, 0, 0, c2.width, c2.height);
      return c2;
    }
    return c;
  },

  /* ------------------------------------------------------- filtres avancés -- */

  /** Suppression des ombres / éclairage inégal : division par le fond estimé. */
  shadowRemove(canvas) {
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const { width: W, height: H } = canvas;
    const id = ctx.getImageData(0, 0, W, H);
    const d = id.data;

    /* Fond estimé sur une copie réduite (≈ 320 px) puis ré-échantillonné : même
       correction visuelle, coût divisé par ~20 (important sur téléphone). */
    const k = Math.min(1, 320 / Math.max(W, H));
    const sw = Math.max(8, Math.round(W * k)), sh = Math.max(8, Math.round(H * k));
    const small = document.createElement('canvas');
    small.width = sw; small.height = sh;
    const sctx = small.getContext('2d', { willReadFrequently: true });
    sctx.drawImage(canvas, 0, 0, sw, sh);
    const sd = sctx.getImageData(0, 0, sw, sh).data;
    const bg = [new Float32Array(sw * sh), new Float32Array(sw * sh), new Float32Array(sw * sh)];
    for (let c = 0; c < 3; c++) for (let i = 0, j = 0; j < sw * sh; i += 4, j++) bg[c][j] = sd[i + c];
    const r = Math.max(4, Math.round(Math.min(sw, sh) * 0.10));
    for (let c = 0; c < 3; c++) bg[c] = this._boxBlur(bg[c], sw, sh, r);

    const gx = sw / W, gy = sh / H;
    for (let y = 0; y < H; y++) {
      const fy = Math.min(sh - 1.001, y * gy);
      const y0 = fy | 0, y1 = Math.min(sh - 1, y0 + 1), wy = fy - y0;
      for (let x = 0; x < W; x++) {
        const fx = Math.min(sw - 1.001, x * gx);
        const x0 = fx | 0, x1 = Math.min(sw - 1, x0 + 1), wx = fx - x0;
        const i00 = y0 * sw + x0, i10 = y0 * sw + x1, i01 = y1 * sw + x0, i11 = y1 * sw + x1;
        const w00 = (1 - wx) * (1 - wy), w10 = wx * (1 - wy), w01 = (1 - wx) * wy, w11 = wx * wy;
        const di = (y * W + x) * 4;
        for (let c = 0; c < 3; c++) {
          const channel = bg[c];
          const b = Math.max(24,
            channel[i00] * w00 + channel[i10] * w10 + channel[i01] * w01 + channel[i11] * w11);
          const v = d[di + c] / b * 232;
          d[di + c] = v > 255 ? 255 : v;
        }
      }
    }
    ctx.putImageData(id, 0, 0);
  },

  /** Saturation + auto-niveaux doux (mode « Vif »). */
  /**
   * Nettoyage magique V2.2 : correction d'éclairage, nettoyage du fond,
   * débruitage léger, normalisation du contraste et netteté.
   * Opère sur le canvas fourni (le pipeline conserve toujours page.src original).
   */
  magicClean(canvas, opts = {}) {
    const strength = clamp(Number(opts.strength ?? 0.7), 0, 1);
    const denoise = opts.denoise !== false;
    const sharpen = opts.sharpen !== false;
    if (opts.illumination !== false) this.shadowRemove(canvas);
    if (opts.watermark) {
      const wctx = canvas.getContext('2d', { willReadFrequently: true });
      const wimg = wctx.getImageData(0, 0, canvas.width, canvas.height); const wd = wimg.data;
      const wf = 0.55 + strength * 0.4;
      for (let i = 0; i < wd.length; i += 4) {
        const mx = Math.max(wd[i], wd[i+1], wd[i+2]), mn = Math.min(wd[i], wd[i+1], wd[i+2]);
        const lum = 0.299*wd[i] + 0.587*wd[i+1] + 0.114*wd[i+2];

        if (lum > 100 && (mx - mn) < 70) { wd[i] += (255-wd[i])*wf; wd[i+1] += (255-wd[i+1])*wf; wd[i+2] += (255-wd[i+2])*wf; }
      }
      wctx.putImageData(wimg, 0, 0);
    }
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const W = canvas.width, H = canvas.height;
    if (!W || !H) return canvas;
    const img = ctx.getImageData(0, 0, W, H);
    const d = img.data, n = W * H;
    const gray = new Float32Array(n);
    const hist = new Uint32Array(256);
    for (let j = 0, i = 0; j < n; j++, i += 4) {
      gray[j] = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
      hist[Math.max(0, Math.min(255, gray[j] | 0))]++;
    }
    // percentiles robustes : le fond devient blanc, l'encre reste lisible
    const pick = (q) => { let acc = 0; const lim = n * q; for (let v = 0; v < 256; v++) { acc += hist[v]; if (acc >= lim) return v; } return 255; };
    const lo = pick(0.015), hi = pick(0.985);
    const span = Math.max(18, hi - lo);
    const gamma = 1 + strength * 0.22;
    for (let j = 0, i = 0; j < n; j++, i += 4) {
      let v = clamp(((gray[j] - lo) * 255) / span, 0, 255);
      v = 255 * Math.pow(v / 255, gamma);
      if (v > 248 && strength > 0.35) v = 255; // fond jauni/gris -> blanc, sans inventer de texte
      gray[j] = v;
    }
    if (denoise) {
      // médiane 3x3 uniquement sur pixels quasi isolés : supprime poussières/taches
      const src = new Float32Array(gray);
      for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++) {
        const j = y * W + x, vals = [];
        for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) vals.push(src[j + dy * W + dx]);
        vals.sort((a, b) => a - b);
        const med = vals[4];
        if (Math.abs(src[j] - med) > 52) gray[j] = med;
      }
    }
    if (sharpen) {
      const src = new Float32Array(gray), amt = 0.28 + strength * 0.35;
      for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++) {
        const j = y * W + x;
        gray[j] = clamp(src[j] * (1 + 4 * amt) - (src[j-1]+src[j+1]+src[j-W]+src[j+W]) * amt, 0, 255);
      }
    }
    for (let j = 0, i = 0; j < n; j++, i += 4) d[i] = d[i+1] = d[i+2] = gray[j];
    ctx.putImageData(img, 0, 0);
    return canvas;
  },

  async fingerprint(src) {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
    const c = document.createElement('canvas'); c.width = 16; c.height = 16;
    const x = c.getContext('2d', { willReadFrequently: true }); x.drawImage(img, 0, 0, 16, 16);
    const d = x.getImageData(0, 0, 16, 16).data, vals = []; let sum = 0;
    for (let i = 0; i < d.length; i += 4) { const v = 0.299*d[i]+0.587*d[i+1]+0.114*d[i+2]; vals.push(v); sum += v; }
    const mean = sum / vals.length;
    return { bits: vals.map(v => v >= mean ? '1' : '0').join(''), mean };
  },
  hamming(a, b) { let n = 0; for (let i = 0; i < Math.min(a.length, b.length); i++) if (a[i] !== b[i]) n++; return n; },

  vivid(canvas) {
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const id = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const d = id.data;
    for (let i = 0; i < d.length; i += 4) {
      const r = d[i], g = d[i + 1], b = d[i + 2];
      const l = 0.299 * r + 0.587 * g + 0.114 * b;
      d[i]     = clamp(l + (r - l) * 1.35, 0, 255);
      d[i + 1] = clamp(l + (g - l) * 1.35, 0, 255);
      d[i + 2] = clamp(l + (b - l) * 1.35, 0, 255);
    }
    ctx.putImageData(id, 0, 0);
  }
};

<script>
/* =============================================================================
 * ScanPro AI — état global, dépôt de documents, UI shell (toasts, feuilles)
 * ========================================================================== */
'use strict';

/* ------------------------------------------------------------- préférences -- */
const Settings = {
  k: 'scanpro.settings.v1',
  defaults: { ocrLangs: 'fra+eng', quality: 'high', defaultFilter: 'doc', autoOcr: false, autoDetect: true, seenOnboarding: false, theme: 'light' },
  data: null,
  load() {
    try { this.data = Object.assign({}, this.defaults, JSON.parse(localStorage.getItem(this.k) || '{}')); }
    catch (e) { this.data = Object.assign({}, this.defaults); }
    return this.data;
  },
  get(key) { if (!this.data) this.load(); return this.data[key]; },
  set(key, val) {
    if (!this.data) this.load();
    this.data[key] = val;
    try { localStorage.setItem(this.k, JSON.stringify(this.data)); } catch (e) {}
  }
};

/* ------------------------------------------------------------------- état -- */
const App = {
  route: 'home',
  param: null,
  docs: [],            // métadonnées
  search: '',
  docFilter: 'all', docSort: 'date-desc', selectionMode: false, selectedDocs: new Set(),
  draft: null,         // {docId?, name, pages:[{id,src,crop,rotate,filter}], active, cropMode, cropRect}
  doc: null,           // document ouvert
  docPages: [],
  detailTab: 'preview',
  detailPage: 0,
  camera: { stream: null, facing: 'environment', torch: false },
  ocrText: {},
  ready: false
};

/* ------------------------------------------------------- toasts / overlay -- */
function toast(msg, type = '', ms = 2600) {
  const host = $('#toasts');
  const icons = { ok: 'i-check', err: 'i-alert' };
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.innerHTML = `<svg class="ico sm"><use href="#${icons[type] || 'i-info'}"/></svg><span>${escapeHtml(msg)}</span>`;
  host.appendChild(el);
  while (host.children.length > 2) host.firstElementChild.remove();
  setTimeout(() => {
    el.style.transition = 'opacity .25s, transform .25s';
    el.style.opacity = '0'; el.style.transform = 'translateY(8px)';
    setTimeout(() => el.remove(), 260);
  }, ms);
  return el;
}
const busyBar = (on) => $('#progress').classList.toggle('on', !!on);

function openSheet({ title = '', sub = '', body = '', actions = [], onMount = null, full = false }) {
  closeSheet();
  const root = $('#modalRoot');
  const back = document.createElement('div');
  back.className = 'backdrop';
  back.innerHTML = `
    <div class="sheet" role="dialog" aria-modal="true" aria-label="${escapeHtml(title || 'Dialogue')}">
      <div class="grab"></div>
      ${title ? `<h3>${escapeHtml(title)}</h3>` : ''}
      ${sub ? `<p class="sub">${sub}</p>` : ''}
      <div class="sheet-body">${body}</div>
      ${actions.length ? `<div class="sheet-actions">
        ${actions.map(a => `<button class="btn ${a.cls || 'ghost'}" ${a.act ? `data-act="${a.act}"` : ''}
          ${a.close !== false ? 'data-close="1"' : ''}>${a.label}</button>`).join('')}
      </div>` : ''}
    </div>`;
  root.appendChild(back);
  back.addEventListener('click', (e) => { if (e.target === back) closeSheet(); });
  back.addEventListener('click', (e) => { if (e.target.closest('[data-close]')) closeSheet(); });
  if (onMount) onMount(back.querySelector('.sheet'));
  return back.querySelector('.sheet');
}
function closeSheet() { const r = $('#modalRoot'); if (r) r.innerHTML = ''; }

function confirmSheet({ title, sub, okLabel = 'Confirmer', danger = false, onOk }) {
  openSheet({
    title, sub,
    actions: [
      { label: 'Annuler', cls: 'ghost' },
      { label: okLabel, cls: danger ? 'danger' : 'primary', act: 'confirm-ok', close: true }
    ],
    onMount: (sheet) => {
      const b = $('[data-act="confirm-ok"]', sheet);
      b.addEventListener('click', () => setTimeout(() => onOk && onOk(), 0), { once: true });
    }
  });
}
function promptSheet({ title, label = 'Nom', value = '', sub = '', okLabel = 'Enregistrer', onOk }) {
  const s = openSheet({
    title, sub,
    body: `<div class="field"><label for="__p">${escapeHtml(label)}</label>
      <input id="__p" value="${escapeHtml(value)}" autocomplete="off" enterkeyhint="done"></div>`,
    actions: [{ label: 'Annuler', cls: 'ghost' }, { label: okLabel, cls: 'primary', act: 'prompt-ok', close: true }],
    onMount: (sheet) => {
      const inp = $('#__p', sheet);
      setTimeout(() => { inp.focus(); inp.select(); }, 60);
      const go = () => { const v = inp.value.trim(); if (v) onOk && onOk(v); };
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); go(); closeSheet(); } });
      $('[data-act="prompt-ok"]', sheet).addEventListener('click', () => setTimeout(go, 0), { once: true });
    }
  });
  return s;
}

/* ------------------------------------------------------------ dépôt docs -- */
const Repo = {
  async list() {
    const docs = await Store.all('docs');
    return docs.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  },
  async create({ name = 'Document', pages = [], file = null, thumb = null, source = 'scan' }) {
    const now = Date.now();
    const doc = {
      id: uid('doc'), name, createdAt: now, updatedAt: now,
      pageCount: pages.length, thumb: thumb || (pages[0] ? pages[0].thumb : null),
      text: '', ocr: { status: pages.length ? 'none' : 'none', at: null, confidence: 0 },
      bytes: 0, source, modified: false, kind: file ? 'pdf' : 'scan', favorite: false, category: '', tags: [], history: [{ at: now, action: 'Création' }]
    };
    let bytes = 0;
    for (let i = 0; i < pages.length; i++) {
      const p = pages[i];
      const rec = {
        id: p.id || uid('pg'), docId: doc.id, index: i, src: p.src,
        crop: p.crop || { x: 0, y: 0, w: 1, h: 1 }, rotate: p.rotate || 0,
        quad: p.quad || null, deskew: p.deskew || 0,
        filter: p.filter || 'none', adj: p.adj || { b: 1, c: 1 }, cleanup: p.cleanup || null, eraser: p.eraser || [], thumb: p.thumb || null, text: p.text || '', ocrConf: p.ocrConf || 0, ocrWords: p.ocrWords || null
      };
      bytes += (rec.src ? rec.src.length * 0.75 : 0) + (rec.thumb ? rec.thumb.length * 0.75 : 0);
      await Store.put('pages', rec);
    }
    if (file) {
      await Store.put('files', { id: doc.id, name: name + '.pdf', blob: file });
      bytes += file.size || 0;
      doc.fileId = doc.id;
    }
    doc.bytes = Math.round(bytes);
    await Store.put('docs', doc);
    App.docs = await this.list();
    return doc;
  },
  async pages(docId) {
    const ps = await Store.byDoc(docId);
    return ps.sort((a, b) => a.index - b.index);
  },
  async doc(id) { return Store.get('docs', id); },
  async update(doc) {
    doc.updatedAt = Date.now();
    const ps = await this.pages(doc.id);
    // les PDF importés conservent le nombre de pages lu par pdf.js
    if (doc.kind !== 'pdf' || ps.length) doc.pageCount = ps.length;
    await Store.put('docs', doc);
    App.docs = await this.list();
    return doc;
  },
  async replacePages(docId, pages) {
    const old = await this.pages(docId);
    for (const p of old) await Store.del('pages', p.id);
    let bytes = 0;
    for (let i = 0; i < pages.length; i++) {
      const p = pages[i];
      const rec = {
        id: p.id || uid('pg'), docId, index: i, src: p.src, crop: p.crop || { x: 0, y: 0, w: 1, h: 1 },
        rotate: p.rotate || 0, quad: p.quad || null, deskew: p.deskew || 0,
        filter: p.filter || 'none', adj: p.adj || { b: 1, c: 1 }, cleanup: p.cleanup || null, eraser: p.eraser || [], thumb: p.thumb || null,
        text: p.text || '', ocrConf: p.ocrConf || 0, ocrWords: p.ocrWords || null
      };
      bytes += (rec.src || '').length * 0.75 + (rec.thumb || '').length * 0.75;
      await Store.put('pages', rec);
    }
    return Math.round(bytes);
  },
  async file(docId) {
    const f = await Store.get('files', docId);
    return f ? f.blob : null;
  },
  async remove(docId) {
    const ps = await this.pages(docId);
    for (const p of ps) await Store.del('pages', p.id);
    await Store.del('files', docId);
    await Store.del('docs', docId);
    App.docs = await this.list();
  },
  async totalBytes() {
    const docs = await Store.all('docs');
    return docs.reduce((s, d) => s + (d.bytes || 0), 0);
  }
};

/* --------------------------------------------------- OCR : exécution + UI -- */
function ocrOverlay() {
  const sheet = openSheet({
    title: 'Reconnaissance de texte',
    sub: 'Analyse locale dans votre navigateur — aucune image n\'est envoyée sur Internet.',
    body: `<div class="row" style="gap:12px;align-items:center;margin:4px 0 10px">
        <span class="spinner dark" id="ocrSpin"></span>
        <div class="grow"><b id="ocrStatus" style="font-size:13.5px">Préparation…</b>
        <div class="ocr-bar"><i id="ocrBar"></i></div>
        <div class="tiny muted" id="ocrPct">0 %</div></div>
      </div>
      <div class="banner info"><svg class="ico sm"><use href="#i-info"/></svg>
        <span>Le premier lancement télécharge les données de langue (français + anglais) puis les met en cache.</span></div>`,
    actions: [{ label: 'Annuler', cls: 'ghost', act: 'ocr-cancel' }]
  });
  return {
    sheet,
    status(t) { const e = $('#ocrStatus'); if (e) e.textContent = t; },
    progress(p, t) {
      const pct = Math.round(clamp(p, 0, 1) * 100);
      const bar = $('#ocrBar'); if (bar) bar.style.width = pct + '%';
      const lab = $('#ocrPct'); if (lab) lab.textContent = pct + ' %';
      if (t && $('#ocrStatus')) $('#ocrStatus').textContent = t;
    },
    close: closeSheet
  };
}

/** OCR d'une liste de pages (objets {src,crop,rotate,filter}) → [{text, confidence}] */
async function runOcr(pages, langs = Settings.get('ocrLangs')) {
  if (location.protocol === 'file:') {
    // fetch() est interdit sur file:// : les modèles de langue ne peuvent pas être lus.
    const msg = "L'OCR nécessite que ScanPro AI soit servie en http(s) (la prévisualisation live ou " +
      "un petit serveur local comme « python3 -m http.server 8080 »). Ouvert en double-clic (file://), " +
      "le navigateur interdit la lecture des modèles de langue. Le reste de l'app (import, recadrage, PDF) fonctionne.";
    toast(msg, 'err', 9000);
    const s = openSheet({
      title: 'OCR indisponible en mode fichier',
      sub: "Cette page a été ouverte directement depuis le disque (file://).",
      body: `<div class="banner warn">${ICON('i-alert', 'ico sm')}<span>${escapeHtml(msg)}</span></div>
        <p class="small muted">Solutions : ouvrez l'application via la prévisualisation de l'environnement
        (HTTPS) ou lancez un serveur local dans le dossier du projet.</p>
        <div class="ai-out" style="font-size:12.5px">cd scanpro\npython3 -m http.server 8080\n# puis http://localhost:8080/</div>`,
      actions: [{ label: 'Compris', cls: 'primary' }]
    });
    return null;
  }
  const ui = ocrOverlay();
  let cancelled = false;
  const cancelBtn = $('[data-act="ocr-cancel"]', ui.sheet);
  if (cancelBtn) cancelBtn.addEventListener('click', () => { cancelled = true; OCR.terminate(); });
  const results = [];
  try {
    const label = ({ 'fra+eng':'français + anglais', fra:'français', eng:'anglais', spa:'espagnol', deu:'allemand', ita:'italien', por:'portugais', 'fra+eng+spa':'français + anglais + espagnol', 'fra+eng+deu':'français + anglais + allemand' })[langs] || langs;
    ui.status('Chargement du moteur OCR (' + label + ')…');
    await OCR.ensure(langs, (m) => {
      if (cancelled) return;
      if (m && m.status) {
        const map = {
          'loading tesseract core': 'Chargement du moteur…',
          'initializing tesseract': 'Initialisation…',
          'loading language traineddata': 'Téléchargement de la langue (' + label + ')…',
          'loaded language traineddata': 'Langue prête',
          'initializing api': 'Initialisation de l\'API…',
          'recognizing text': 'Reconnaissance du texte…'
        };
        ui.status(map[m.status] || m.status);
        ui.progress(m.progress || 0);
      }
    });
    for (let i = 0; i < pages.length; i++) {
      if (cancelled) throw new Error('annulé');
      ui.status(`Reconnaissance — page ${i + 1}/${pages.length}`);
      ui.progress(0);
      let dataUrl;
      if (typeof pages[i] === 'string') dataUrl = pages[i];
      else {
        const c = await ImageOps.render(pages[i], { maxPx: 2000, quality: 0.95 });
        dataUrl = c.toDataURL('image/jpeg', 0.95);
      }
      const res = await OCR.run(dataUrl, langs, (m) => {
        if (cancelled || !m) return;
        if (m.status === 'recognizing text') {
          ui.progress((i + (m.progress || 0)) / pages.length);
          ui.status(`Reconnaissance — page ${i + 1}/${pages.length}`);
        }
      });
      results.push(res);
      ui.progress((i + 1) / pages.length);
    }
    ui.close();
    return results;
  } catch (err) {
    ui.close();
    if (String(err && err.message).includes('annulé')) { toast('OCR annulé'); return null; }
    console.error('[OCR]', err);
    toast("L'OCR n'a pas pu être effectué : " + (err.message || 'erreur inconnue'), 'err', 6000);
    throw err;
  }
}

/* Point d'entrée de débogage (console) — n'expose aucune donnée à l'extérieur. */
window.ScanPro = {
  get App() { return App; }, get Repo() { return Repo; }, get Settings() { return Settings; },
  get AI() { return AI; }, get Acc() { return Acc; }, get Actions() { return Actions; }, Store, PDF, ImageOps,
  version: '2.12.0'
};

/* ------------------------------------------------------- exécution d'acte -- */
const Actions = {};   // rempli par views.js / ui.js

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const name = el.dataset.act;
  if (name === 'ocr-cancel' || name === 'confirm-ok' || name === 'prompt-ok') return; // gérés localement
  const fn = Actions[name];
  if (typeof fn === 'function') {
    e.preventDefault();
    fn(el, e);
  }
});

/* ------------------------------------------------------------- impression -- */
function printPdf(blob) {
  const url = URL.createObjectURL(blob);
  const w = window.open(url, '_blank');
  if (w) { toast('PDF ouvert : utilisez le menu du navigateur → Imprimer', 'ok', 5000); return; }
  const f = document.createElement('iframe');
  f.style.cssText = 'position:fixed;width:0;height:0;border:0;right:0;bottom:0';
  document.body.appendChild(f);
  f.onload = () => {
    try { f.contentWindow.focus(); f.contentWindow.print(); }
    catch (err) { toast("Impression directe bloquée — utilisez « Télécharger » puis imprimer.", 'err', 5000); }
    setTimeout(() => f.remove(), 60000);
  };
  f.src = url;
}

/* ------------------------------------------------------------- utilitaires -- */
async function copyText(text) {
  if (!text) { toast('Rien à copier', 'err'); return false; }
  try {
    if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); }
    else {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
    }
    toast('Texte copié', 'ok');
    return true;
  } catch (e) { toast('Copie impossible sur ce navigateur', 'err'); return false; }
}

async function shareText(text, title = 'Texte reconnu — ScanPro AI') {
  if (!text) { toast('Aucun texte à partager', 'err'); return; }
  if (navigator.share) {
    try { await navigator.share({ title, text }); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  copyText(text);
}

function pdfName(doc, suffix = '') {
  return slugify(doc.name || 'document') + (suffix ? '-' + suffix : '') + '.pdf';
}

/** Génère un PDF pour un document stocké. Retourne {blob, build:boolean} */
async function buildDocPdf(doc, opts = {}) {
  const noMods = !doc.modified;
  if (doc.fileId && noMods) {
    const blob = await Repo.file(doc.id);
    if (blob) return { blob, original: true };
  }
  const pages = await Repo.pages(doc.id);
  if (!pages.length) throw new Error('Ce document ne contient aucune page.');
  const quality = Settings.get('quality') === 'high' ? 0.92 : 0.8;
  const maxPx = Settings.get('quality') === 'high' ? 2400 : 1600;
  const { blob } = await PDF.build(pages, {
    name: doc.name, quality, maxPx,
    onProgress: (p, label) => opts.onProgress && opts.onProgress(p, label)
  });
  return { blob, original: false };
}

'use strict';

        <span>·</span>
        <span>${plural(doc.pageCount || 0, 'page', 'pages')}</span>
        ${compact ? '' : `<span>·</span><span>${fmtBytes(doc.bytes)}</span>`}
      </div>

function searchResultsHtml(q) {
  const needle = q.toLowerCase();
  const hits = App.docs.filter(d =>
    (d.name || '').toLowerCase().includes(needle) ||
    (d.text || '').toLowerCase().includes(needle));
  if (!hits.length) {
    return `<div class="banner info mt10">${ICON('i-info', 'ico sm')}
      <span>Aucun résultat pour « ${escapeHtml(q)} ». La recherche porte sur le nom et sur le texte reconnu (OCR).</span></div>`;
  }
  return `<div class="doc-list mt10">${hits.slice(0, 6).map(d => docCard(d, { compact: true })).join('')}</div>`;
}

/* ============================== DOCUMENTS ================================ */
function viewDocs() {
  const filters = [['all', 'Tous'], ['scan', 'Scans'], ['pdf', 'PDF importés'], ['ocr', 'Avec OCR'], ['fav', 'Favoris']];
  let docs = App.docs.slice();
  if (App.docFilter === 'scan') docs = docs.filter(d => d.kind !== 'pdf');
  if (App.docFilter === 'pdf') docs = docs.filter(d => d.kind === 'pdf');
  if (App.docFilter === 'ocr') docs = docs.filter(d => d.ocr && d.ocr.status === 'done');
  if (App.docFilter === 'fav') docs = docs.filter(d => d.favorite);
  if (App.search) {
    const n = App.search.toLowerCase();
    docs = docs.filter(d => (d.name || '').toLowerCase().includes(n) || (d.text || '').toLowerCase().includes(n));
  }
  const sorters = { 'date-desc':(a,b)=>(b.createdAt||0)-(a.createdAt||0), 'date-asc':(a,b)=>(a.createdAt||0)-(b.createdAt||0), name:(a,b)=>String(a.name).localeCompare(String(b.name),'fr'), pages:(a,b)=>(b.pageCount||0)-(a.pageCount||0), size:(a,b)=>(b.bytes||0)-(a.bytes||0), type:(a,b)=>String(a.kind).localeCompare(String(b.kind)) || String(a.name).localeCompare(String(b.name),'fr') };
  docs.sort(sorters[App.docSort] || sorters['date-desc']);
  const totalBytes = App.docs.reduce((s, d) => s + (d.bytes || 0), 0);
  return `
  <header class="appbar">
    <div class="appbar-row">
      <h1 style="margin-left:2px">Documents</h1>

    </label>
    <div class="filters" id="docFilters" style="padding:12px 0 0">
      ${filters.map(([k, l]) => `<button class="chip sm ${App.docFilter === k ? 'on' : ''}"
        data-act="filter-docs" data-key="${k}">${l}</button>`).join('')}
    </div>
  </header>
  <div class="content">
    <div class="row small muted" style="margin:0 2px 10px">
      <span class="grow">${plural(docs.length, 'document', 'documents')} · ${fmtBytes(totalBytes)}</span>
    </div>
    <div class="row wrap" style="gap:7px;margin-bottom:10px">
      <button class="btn xs soft" data-act="docs-sort">Trier : ${{ 'date-desc':'Date ↓', 'date-asc':'Date ↑', name:'Nom', pages:'Pages', size:'Taille', type:'Type' }[App.docSort] || 'Date ↓'}</button>
      <button class="btn xs soft" data-act="docs-select-mode">${App.selectionMode ? 'Terminer la sélection' : 'Sélection multiple'}</button>
      <button class="btn xs ghost" data-act="docs-duplicates">Doublons documents</button>
    </div>
    ${App.selectionMode ? `<div class="banner info" style="margin-bottom:10px"><span><b>${App.selectedDocs.size} sélectionné(s).</b> Touchez les documents pour les cocher.</span></div>
    <div class="row wrap" style="gap:7px;margin-bottom:10px">
      <button class="btn xs soft" data-act="docs-batch-rename">Renommer par lots</button>
      <button class="btn xs soft" data-act="docs-batch-fav">Favoris</button>
      <button class="btn xs soft" data-act="docs-batch-cat">Catégorie</button>

  const p = pages[App.detailPage] || pages[0];
  const tab = App.detailTab;
  const text = doc.text || '';
  return `
  <header class="appbar">
    <div class="appbar-row">
      <button class="icon-btn" data-act="go-back" aria-label="Retour">${ICON('i-back')}</button>

      <button class="icon-btn" data-act="doc-menu" data-id="${doc.id}" aria-label="Actions du document">${ICON('i-more')}</button>

function viewAcc() {
  const docs = App.docs || [];
  const sel = docs.find(d => d.id === App.accDocId) || null;
  const acc = sel && sel.acc ? sel.acc : null;
  const confChip = (c, st) => st === 'corrige' ? '<span class="chip ok">corrigé</span>'
    : c >= 80 ? `<span class="chip ok">${c} %</span>` : c >= 50 ? `<span class="chip warn">${c} %</span>`
    : c > 0 ? `<span class="chip err">${c} %</span>` : '<span class="chip err">Non reconnu</span>';
  let detail = '';
  if (sel && acc) {
    const d = acc.data;
    const labels = { docType: 'Type de document', lender: 'Prêteur', borrower: 'Emprunteur', loanAmount: 'Montant du prêt', rate: "Taux d'intérêt", duration: 'Durée (mois)', employee: 'Salarié', employer: 'Employeur', period: 'Période de paie', baseSalary: 'Salaire de base', hours: 'Heures', bonuses: 'Primes', absences: 'Absences (h/j)', gross: 'Salaire brut', employeeContributions: 'Cotisations salariales', employerContributions: 'Cotisations patronales', netTaxable: 'Net imposable', netSocial: 'Net social', netPayable: 'Net à payer', amountPaid: 'Montant versé', bank: 'Banque', holder: 'Titulaire du compte', iban: 'IBAN', bic: 'BIC', openingBalance: "Solde d'ouverture", closingBalance: 'Solde de clôture', supplier: 'Fournisseur / Client', address: 'Adresse', siren: 'SIREN', siret: 'SIRET', invoiceNumber: 'Numéro', issueDate: "Date d'émission", dueDate: "Date d'échéance", validityDate: 'Validité (devis)', expenseTotal: 'Total note de frais', expenseCount: 'Nombre de justificatifs', orderRef: 'Référence commande', paymentTerms: 'Conditions de règlement', deposit: 'Acompte', totalHT: 'Total HT', vatAmount: 'Montant TVA', totalTTC: 'Total TTC', currency: 'Devise' };
    detail = `
    <div class="card">
      <div class="row"><b class="grow">${escapeHtml(sel.name)}</b><span class="chip ${acc.edited ? 'warn' : 'ok'}">${acc.edited ? 'Corrigé manuellement' : 'Extraction automatique'}</span></div>
      <label class="small muted">Type de document (proposé : ${escapeHtml((Acc.TYPES.find(x => x[0] === d.docType) || [])[1] || d.docType)} — modifiable)
      <select id="accTypeSel">${Acc.TYPES.map(([v, l]) => `<option value="${v}" ${d.docType === v ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
      <div class="invoice-grid">
      ${Object.keys(labels).filter(k => k === 'docType' || (d.fields || {})[k]).map(k => { const f = (d.fields || {})[k] || { value: 'Non reconnu', confidence: 0 }; return `<label>${labels[k]} ${confChip(f.confidence, f.status)}
        <span class="row"><input data-acc-field="${k}" value="${escapeHtml(f.value === 'Non reconnu' ? '' : f.value)}" placeholder="Non reconnu">
        ${f.zone ? `<button class="btn xs soft" data-act="acc-zone" data-page="${f.zone.page}" data-x="${f.zone.x}" data-y="${f.zone.y}" data-w="${f.zone.w}" data-h="${f.zone.h}">Voir p.${f.zone.page + 1}</button>` : ''}</span></label>`; }).join('')}
      </div>
      ${(d.transactions && d.transactions.length) ? `<h4>Opérations (${d.transactions.length}) — ordre du relevé préservé</h4>
      <div class="acc-lines">${d.transactions.map((x, i) => `<div class="row acc-line"><input data-acc-tx="${i}:date" value="${escapeHtml(x.date)}" size="9"><input data-acc-tx="${i}:label" value="${escapeHtml(x.label)}"><input data-acc-tx="${i}:debit" value="${x.debit ?? ''}" placeholder="Débit" size="7"><input data-acc-tx="${i}:credit" value="${x.credit ?? ''}" placeholder="Crédit" size="7"><input data-acc-tx="${i}:balance" value="${x.balance ?? ''}" placeholder="Solde" size="7">${x.duplicate ? '<span class="chip warn">doublon ?</span>' : ''}${x.status === 'a-verifier' ? '<span class="chip err">à vérifier</span>' : ''}</div>`).join('')}</div>
      <p class="small muted">Totaux reconnus — débits : ${d.totals ? d.totals.debit : 'Non reconnu'} · crédits : ${d.totals ? d.totals.credit : 'Non reconnu'} (les opérations « à vérifier » ne sont pas totalisées).</p>` : ''}
      ${d.sensitive ? '<div class="banner warn"><span>🔒 Document sensible (paie) : traitement 100 % local, aucune télémétrie, aucun envoi externe. Vérifiez que brut, net imposable, net social et net à payer ne sont pas confondus.</span></div>' : ''}
      ${(d.statementRows && d.statementRows.length) ? `<h4>État financier reconnu (${d.statementRows.length} lignes)</h4>
      <div class="acc-lines">${d.statementRows.map((r, i) => `<div class="row acc-line"><input data-acc-fin="${i}:section" value="${escapeHtml(r.section)}" size="8"><input data-acc-fin="${i}:account" value="${escapeHtml(r.account || '')}" size="7" placeholder="Compte"><input data-acc-fin="${i}:label" value="${escapeHtml(r.label)}"><input data-acc-fin="${i}:amountN" value="${r.amountN ?? ''}" size="9" placeholder="N"><input data-acc-fin="${i}:amountN1" value="${r.amountN1 ?? ''}" size="9" placeholder="N-1">${r.isTotal ? '<span class="chip ok">total</span>' : ''}</div>`).join('')}</div>` : ''}
      ${(d.scheduleRows && d.scheduleRows.length) ? `<h4>Échéancier reconnu (${d.scheduleRows.length} échéances)</h4>
      <div class="acc-lines">${d.scheduleRows.map((r, i) => `<div class="row acc-line"><input data-acc-loan="${i}:date" value="${escapeHtml(r.date)}" size="9"><input data-acc-loan="${i}:total" value="${r.total}" placeholder="Échéance" size="7"><input data-acc-loan="${i}:capital" value="${r.capital}" placeholder="Capital" size="7"><input data-acc-loan="${i}:interest" value="${r.interest}" placeholder="Intérêts" size="7"><input data-acc-loan="${i}:insurance" value="${r.insurance ?? 0}" placeholder="Assur." size="6"><input data-acc-loan="${i}:remaining" value="${r.remaining}" placeholder="Restant dû" size="8"><span class="tiny muted">recalc. ${r.computedRemaining ?? '—'}</span></div>`).join('')}</div>
      <p class="tiny muted">La valeur « recalc. » est la vérification de l'application (montant du prêt − capitaux remboursés) : elle ne remplace jamais le capital restant reconnu.</p>` : ''}
      ${(d.assetRows && d.assetRows.length) ? `<h4>Immobilisations reconnues (${d.assetRows.length})</h4>
      <div class="acc-lines">${d.assetRows.map((r, i) => `<div class="row acc-line"><input data-acc-asset="${i}:label" value="${escapeHtml(r.label)}"><input data-acc-asset="${i}:originalValue" value="${r.originalValue ?? ''}" placeholder="Valeur origine" size="8"><input data-acc-asset="${i}:annualDepreciation" value="${r.annualDepreciation ?? ''}" placeholder="Dotation" size="7"><input data-acc-asset="${i}:accumulated" value="${r.accumulated ?? ''}" placeholder="Cumulés" size="7"><input data-acc-asset="${i}:netBookValue" value="${r.netBookValue ?? ''}" placeholder="VNC" size="7"></div>`).join('')}</div>` : ''}
      <h4>Traçabilité</h4>
      <p class="small muted">Document : ${escapeHtml(sel.name)} · Analysé le ${acc.at ? new Date(acc.at).toLocaleString('fr-FR') : 'Non reconnu'}${acc.savedAt ? ' · Corrections enregistrées le ' + new Date(acc.savedAt).toLocaleString('fr-FR') : ''} · Confiance OCR du document : ${sel.ocr && sel.ocr.confidence ? sel.ocr.confidence + ' %' : 'Non reconnu'} · ${plural(sel.pageCount || 0, 'page', 'pages')} — original, texte OCR et données structurées restent liés à ce document.</p>
      ${(d.expenseRows && d.expenseRows.length) ? `<h4>Justificatifs reconnus (${d.expenseRows.length})</h4>
      <div class="acc-lines">${d.expenseRows.map(r => `<div class="row acc-line"><span class="tiny muted">${escapeHtml(r.date || '')}</span><span class="grow">${escapeHtml(r.label)}</span><span class="chip sm">${escapeHtml(r.category)}</span><b>${r.amount}</b></div>`).join('')}</div>` : ''}
      <h4>Lignes d'articles</h4>
      ${(d.lines || []).length ? `<div class="acc-lines">${d.lines.map((l, i) => `<div class="row acc-line"><input data-acc-line="${i}:description" value="${escapeHtml(l.description)}"><input data-acc-line="${i}:qty" value="${l.qty}" size="4"><input data-acc-line="${i}:unitPrice" value="${l.unitPrice}" size="7"><input data-acc-line="${i}:amount" value="${l.amount}" size="8"></div>`).join('')}</div>` : '<p class="small muted">Aucune ligne reconnue — à compléter manuellement si le document en comporte.</p>'}
      <h4>TVA par taux</h4>
      ${(d.vat || []).length ? d.vat.map(v => `<div class="row"><span class="grow">TVA ${v.rate} %</span><b>${v.amount}</b></div>`).join('') : '<p class="small muted">Aucun taux de TVA reconnu.</p>'}
      <h4>Contrôles de cohérence</h4>
      ${(d.controls || []).length ? d.controls.map(c => `<div class="banner ${c.ok ? 'ok' : 'warn'}"><span>${c.ok ? '✓' : '⚠'} <b>${escapeHtml(c.label)}</b> — ${escapeHtml(c.detail)}</span></div>`).join('') : '<p class="small muted">Données insuffisantes pour un contrôle (il faut HT, TVA et TTC reconnus).</p>'}
      <p class="tiny muted">${escapeHtml(d.disclaimer || '')} Traitement 100 % local : aucun document comptable n'est envoyé à un service externe.</p>
      <div class="btn-row">
        <button class="btn go" data-act="acc-save">Enregistrer les corrections</button>
        <button class="btn soft" data-act="acc-export" data-fmt="csv">Export CSV</button>
        <button class="btn soft" data-act="acc-export" data-fmt="xlsx">Export XLSX</button>
        <button class="btn soft" data-act="acc-export" data-fmt="json">Export JSON</button>
        ${(d.fields && d.fields.totalHT && d.fields.totalTTC) ? '<button class="btn soft" data-act="acc-export" data-fmt="entries">Écritures (CSV)</button>' : ''}
      </div>
      <div class="btn-row"><button class="btn ghost" data-act="acc-open-doc">Voir le document (original, OCR, pages)</button>
      <button class="btn ghost" data-act="acc-analyze">Relancer la reconnaissance</button></div>
    </div>`;
  } else if (sel) {
    detail = `<div class="card"><b>${escapeHtml(sel.name)}</b>
      <p class="small muted">${sel.text ? 'Texte OCR présent : la reconnaissance structurée peut être lancée.' : "Aucun texte OCR : lancez d'abord l'OCR depuis le document, puis revenez ici."}</p>
      <label class="small muted">Type de document<select id="accTypeSel"><option value="auto">Automatique (proposé par l'application)</option>${Acc.TYPES.map(([v, l]) => `<option value="${v}">${l}</option>`).join('')}</select></label>
      <div class="btn-row"><button class="btn go" data-act="acc-analyze">Lancer la reconnaissance</button>
      <button class="btn ghost" data-act="acc-open-doc">Ouvrir le document</button></div></div>`;
  }
  return `<div class="screen">
    <header class="appbar"><div><h1>Comptabilité</h1><p class="sub">Reconnaissance structurée, contrôle et export — 100 % local</p></div></header>
    <div class="banner info"><span>Choisissez un document, vérifiez chaque champ (confiance affichée), corrigez si besoin puis exportez. « Non reconnu » signifie que l'information n'a pas été trouvée : elle n'est jamais inventée.</span></div>
    <h3 class="sect">Centre de contrôle</h3>
    ${(() => { const analyzed = docs.filter(d => d.acc); const issues = [];
      for (const d of analyzed) { const data = d.acc.data || {}; const lowF = Object.entries(data.fields || {}).filter(([, f]) => f && f.value !== 'Non reconnu' && (f.confidence || 0) < 50).length; const nr = Object.values(data.fields || {}).filter(f => f && f.value === 'Non reconnu').length; const koCtl = (data.controls || []).filter(c => !c.ok).length; if (lowF + nr + koCtl) issues.push({ name: d.name, id: d.id, count: lowF + nr + koCtl }); }
      return `<div class="card"><div class="row"><b class="grow">${analyzed.length} document(s) analysé(s) sur ${docs.length}</b><button class="btn xs soft" data-act="acc-analyze-all">Analyser tous ceux avec OCR</button></div>
      ${issues.length ? `<p class="small muted">À vérifier en priorité :</p>` + issues.map(i => `<div class="row"><span class="grow">${escapeHtml(i.name)} — ${i.count} point(s) à vérifier</span><button class="btn xs soft" data-act="acc-select" data-id="${i.id}">Ouvrir</button></div>`).join('') : '<p class="small muted">Aucun point faible détecté sur les documents analysés (confiance, champs manquants, contrôles).</p>'}</div>`; })()}
    <h3 class="sect">Documents</h3>
    ${docs.length ? docs.map(d => `<div class="card row"><div class="grow"><b>${escapeHtml(d.name)}</b><br><span class="tiny muted">${d.acc ? 'Type : ' + escapeHtml((Acc.TYPES.find(x => x[0] === d.acc.data.docType) || [])[1] || d.acc.data.docType) + (d.acc.edited ? ' · corrigé' : '') : (d.text ? 'OCR présent, non analysé' : 'Sans OCR')}</span></div>
      <button class="btn xs ${sel && sel.id === d.id ? 'go' : 'soft'}" data-act="acc-select" data-id="${d.id}">${sel && sel.id === d.id ? 'Sélectionné' : 'Choisir'}</button></div>`).join('') : '<p class="muted">Aucun document. Scannez ou importez d\'abord un document comptable.</p>'}
    ${detail}
  </div>`;
}

async function render() {
  const view = $('#view');
  document.body.classList.toggle('detail-open', App.route === 'detail');
  $$('.nav-item').forEach(b => b.classList.toggle('active',
    (App.route === 'docs' && b.dataset.nav === 'docs') ||
    (App.route === 'settings' && b.dataset.nav === 'settings') ||
    (App.route === 'tools' && b.dataset.nav === 'tools') ||
    (App.route === 'acc' && b.dataset.nav === 'acc') ||
    (['home', 'detail'].includes(App.route) && b.dataset.nav === 'home')));

  if (App.route === 'home') view.innerHTML = viewHome();
  else if (App.route === 'docs') view.innerHTML = viewDocs();
  else if (App.route === 'settings') { view.innerHTML = await viewSettings(); }
  else if (App.route === 'tools') view.innerHTML = viewTools();
  else if (App.route === 'acc') view.innerHTML = viewAcc();
  else if (App.route === 'detail') view.innerHTML = viewDocDetail();

  if (App.route === 'home' || App.route === 'docs') {
    const inp = $('#homeSearch') || $('#docsSearch');
    if (inp) {
      const target = inp.id;
      if (App._focusSearch) { setTimeout(() => inp.focus(), 60); App._focusSearch = false; }
      if (inp.value) inp.setSelectionRange(inp.value.length, inp.value.length);
    }
    if (App._focusSearch) { const i = $('#homeSearch') || $('#docsSearch'); if (i) setTimeout(() => i.focus(), 80); }
  }
  if (App.route === 'detail') {
    const bar = $('.appbar .row'); // rien
  }
  // aperçu HD + analyses IA déjà calculées
  if (App.route === 'detail' && App.detailTab === 'preview' && App.docPages.length) {
    showFullPreview();
    const box = $('#previewBox');
    if (box && App.docPages.length > 1) {
      let sx = 0, sy = 0, tracking = false;
      const end = async (x, y) => {
        if (!tracking) return;
        tracking = false;
        const dx = x - sx, dy = y - sy;
        if (Math.abs(dx) < 40 || Math.abs(dx) < Math.abs(dy)) return;
        if (dx < 0 && App.detailPage < App.docPages.length - 1) { App.detailPage++; await render(); }
        else if (dx > 0 && App.detailPage > 0) { App.detailPage--; await render(); }
      };
      box.addEventListener('touchstart', (e) => {
        const t = e.touches[0]; sx = t.clientX; sy = t.clientY; tracking = true;
      }, { passive: true });
      box.addEventListener('touchend', (e) => {
        const t = e.changedTouches[0];
        if (t) end(t.clientX, t.clientY);
      });
      box.addEventListener('pointerdown', (e) => {
        if (tracking) return;
        sx = e.clientX; sy = e.clientY; tracking = true;
      });
      box.addEventListener('pointerup', (e) => end(e.clientX, e.clientY));
      box.addEventListener('pointercancel', () => { tracking = false; });
    }
  }
  if (App.route === 'detail' && App.detailTab === 'ai') rerenderAiPanels();
  // écouteur de saisie OCR
  const ed = $('#ocrEditor');
  if (ed) {
    let t = null;
    ed.addEventListener('input', () => {
      const hint = $('#saveHint');
      if (hint) hint.textContent = 'Modifications non enregistrées';
      clearTimeout(t);
      t = setTimeout(async () => {
        App.doc.text = ed.value;
        App.doc.modified = true;
        await Repo.update(App.doc);
        if (hint) hint.textContent = 'Enregistré automatiquement ✓';
      }, 900);
    });
  }
  window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
}

<script>
/* =============================================================================
 * ScanPro AI — interactions : navigation, capture caméra, éditeur de pages,
 * actions documents, OCR, export PDF, assistant local.
 * ========================================================================== */
'use strict';

/* ------------------------------------------------------------ navigation -- */
const NAV = { home: 'Accueil', docs: 'Documents', tools: 'Outils', settings: 'Paramètres' };

async function go(route, param = null, { push = true, focusSearch = false } = {}) {
  if (App.route === 'capture') closeCamera();
  App.route = route; App.param = param;
  App._focusSearch = focusSearch;
  if (route === 'detail') {
    App.doc = await Repo.doc(param);
    App.docPages = App.doc ? await Repo.pages(param) : [];
    App.detailPage = 0;
    App.detailTab = App.detailTab || 'preview';
  }
  $('#bottomNav').style.display = (route === 'capture' || App.route === 'editor') ? 'none' : 'flex';
  if (push) {
    try { history.pushState({ route, param }, '', '#' + route + (param ? '/' + param : '')); } catch (e) {}
  }
  await render();
}

window.addEventListener('popstate', (e) => {
  const st = e.state || { route: 'home' };
  if (App.route === 'capture' || $('#editorScreen')) { closeCamera(); $('#captureRoot').innerHTML = ''; App.draft = null; }
  go(st.route || 'home', st.param || null, { push: false });
});

/* ================================================================ CAMÉRA == */
function cameraSupported() {
  return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
}

async function openCamera() {
  const root = $('#captureRoot');
  App.draft = App.draft || { name: 'Scan ' + new Date().toLocaleDateString('fr-FR'), pages: [], active: 0 };
  App.route = 'capture';
  $('#bottomNav').style.display = 'none';
  root.innerHTML = `
  <div class="capture" id="cameraScreen">
    <div class="cam-stage">
      <video id="camVideo" playsinline autoplay muted></video>
      <div class="cam-topbar">
        <button class="icon-btn" data-act="camera-close" aria-label="Fermer">${ICON('i-x')}</button>
        <span class="spacer"></span>
        <span class="pill" id="camPagesPill">${plural(App.draft.pages.length, 'page', 'pages')}</span>
        <button class="icon-btn" data-act="camera-torch" aria-label="Torche" id="torchBtn">${ICON('i-sun')}</button>
      </div>
      <div class="cam-overlay" id="camOverlay">
        <div class="cam-frame"><i></i><i></i><i></i><i></i></div>
      </div>
      <button class="burst-toggle" id="burstToggle" data-act="burst-toggle" aria-pressed="false">
        ${ICON('i-burst', 'ico sm')} <span>Rafale</span>
      </button>
      <div class="cam-hint" id="camHint">Placez le document dans le cadre — restez stable</div>
    </div>
    <div class="cam-bottom">
      <div id="camPages" class="cam-pages" style="display:none"></div>
      <div id="camError"></div>
      <div class="shutter-row">
        <button class="side-action" data-act="camera-import-gallery">
          <span class="sa-btn">${ICON('i-image', 'ico sm')}</span>Galerie
        </button>
        <button class="shutter" data-act="camera-shoot" aria-label="Prendre une photo"><i></i></button>
        <button class="side-action" data-act="camera-done">
          <span class="sa-btn">${ICON('i-check', 'ico sm')}</span>Terminer
        </button>
      </div>
    </div>
  </div>`;
  updateCamPages();
  await startStream();
}

async function startStream() {
  const video = $('#camVideo');
  const errBox = $('#camError');
  const overlay = $('#camOverlay');
  if (!cameraSupported()) {
    overlay.style.display = 'none';
    errBox.innerHTML = `<div class="cam-warn">${ICON('i-alert', 'ico sm')}
      <span>Ce navigateur ne permet pas l'accès direct à la caméra (API absente).
      Utilisez <b>Galerie</b> pour photographier via l'application Appareil photo, ou ouvrez l'app en HTTPS.</span></div>`;
    return;
  }
  if (!window.isSecureContext) {
    overlay.style.display = 'none';
    errBox.innerHTML = `<div class="cam-warn">${ICON('i-alert', 'ico sm')}
      <span><b>Contexte non sécurisé :</b> la caméra n'est autorisée qu'en <b>HTTPS</b> (ou localhost).
      Utilisez le bouton <b>Galerie</b> en attendant.</span></div>`;
    return;
  }
  try {
    const constraints = {
      audio: false,
      video: App.camera.facing === 'environment'
        ? { facingMode: { ideal: 'environment' }, width: { ideal: 2048 }, height: { ideal: 1536 } }
        : { facingMode: 'user', width: { ideal: 1280 } }
    };
    const stream = await navigator.mediaDevices.getUserMedia(constraints);
    App.camera.stream = stream;
    video.srcObject = stream;
    await video.play().catch(() => {});
    const track = stream.getVideoTracks()[0];
    const caps = track.getCapabilities ? track.getCapabilities() : {};
    $('#torchBtn').style.display = caps.torch ? 'grid' : 'none';
    errBox.innerHTML = '';
    overlay.style.display = 'grid';
  } catch (err) {
    overlay.style.display = 'none';
    const map = {
      NotAllowedError: "L'accès à la caméra a été refusé. Autorisez la caméra dans les réglages du navigateur (icône cadenas → Autorisations), puis réessayez.",
      PermissionDeniedError: "L'accès à la caméra a été refusé par le système.",
      NotFoundError: 'Aucune caméra détectée sur cet appareil.',
      NotReadableError: "La caméra est déjà utilisée par une autre application.",
      OverconstrainedError: 'La caméra ne prend pas en charge la résolution demandée.'
    };
    errBox.innerHTML = `<div class="cam-warn">${ICON('i-alert', 'ico sm')}
      <span>${escapeHtml(map[err.name] || ('Caméra indisponible : ' + err.message))}<br>
      Vous pouvez importer une photo avec <b>Galerie</b>.</span></div>`;
  }
}

function closeCamera() {
  if (Burst.active) toggleBurst();
  clearInterval(Burst.timer); Burst.timer = null; Burst.active = false;
  if (App.camera.stream) {
    App.camera.stream.getTracks().forEach(t => t.stop());
    App.camera.stream = null;
  }
  const v = $('#camVideo'); if (v) v.srcObject = null;
  App.route = App.route === 'capture' ? 'home' : App.route;
  $('#bottomNav').style.display = 'flex';
}

function updateCamPages() {
  const box = $('#camPages'); if (!box) return;
  const pages = App.draft ? App.draft.pages : [];
  box.style.display = pages.length ? 'flex' : 'none';
  box.innerHTML = pages.map((p, i) =>
    `<div class="cam-page"><b>${i + 1}</b><img src="${p.thumb || p.src}" alt=""></div>`).join('');
  const pill = $('#camPagesPill');
  if (pill) pill.textContent = pages.length ? plural(pages.length, 'page', 'pages') : 'Aucune page';
  const hint = $('#camHint');
  if (hint) hint.textContent = pages.length
    ? plural(pages.length, 'page capturée', 'pages capturées') + ' — continuez ou appuyez sur Terminer'
    : 'Placez le document dans le cadre — restez stable';
}

/* ---------------------------------------------------------- mode rafale -- */
const Burst = { active: false, count: 0, timer: null, lastShot: 0, saved: 'none' };

function toggleBurst() {
  const btn = $('#burstToggle');
  if (!App.camera.stream) { toast('La caméra doit être active pour la rafale', 'err'); return; }
  Burst.active = !Burst.active;
  if (btn) {
    btn.classList.toggle('on', Burst.active);
    btn.setAttribute('aria-pressed', String(Burst.active));
    btn.querySelector('span').textContent = Burst.active ? 'Arrêter' : 'Rafale';
  }
  const hint = $('#camHint');
  if (Burst.active) {
    toast('Rafale : une photo toutes les 1,2 s — appuyez sur Arrêter', 'ok', 3000);
    const before = Settings.get('defaultFilter');
    Burst.saved = before;
    Settings.set('defaultFilter', before || 'doc');   // la rafale privilégie un rendu net
    Burst.count = 0;
    let busy = false;
    Burst.timer = setInterval(async () => {
      if (!Burst.active) return;
      if (busy) return;
      if (!App.camera.stream) { toggleBurst(); return; }
      busy = true;
      try {
        await capturePhoto({ quiet: true });
        Burst.count++;
        if (hint) hint.textContent = `Rafale en cours — ${plural(Burst.count, 'page capturée', 'pages capturées')}`;
        if (Burst.count >= 20) { toggestionBurstLimit(); }
      } finally { busy = false; }
    }, 1200);
  } else {
    clearInterval(Burst.timer); Burst.timer = null;
    Settings.set('defaultFilter', Burst.saved || 'doc');
    if (hint) hint.textContent = 'Placez le document dans le cadre — restez stable';
    if (Burst.count) toast(plural(Burst.count, 'page capturée en rafale', 'pages capturées en rafale'), 'ok');
    Burst.count = 0;
  }
}
function toggestionBurstLimit() {
  Burst.active = true;
  toggleBurst();
  toast('Limite de 20 pages atteinte — rafale arrêtée', 'err', 3000);
}

async function capturePhoto(opts = {}) {
  const video = $('#camVideo');
  if (!video || !video.videoWidth) {
    toast('La caméra n\'est pas encore prête', 'err');
    return;
  }
  const c = document.createElement('canvas');
  c.width = video.videoWidth; c.height = video.videoHeight;
  c.getContext('2d').drawImage(video, 0, 0, c.width, c.height);
  const dataUrl = c.toDataURL('image/jpeg', 0.92);
  const page = await addPageFromDataUrl(dataUrl, { detect: opts.detect !== false });
  if (page && page.detected && !opts.quiet) toast('Document détecté et redressé', 'ok', 1600);
  if (opts.quiet) return page;
  // flash visuel
  const app = $('#cameraScreen');
  if (app) {
    const fl = document.createElement('div');
    fl.style.cssText = 'position:fixed;inset:0;background:#fff;z-index:70;opacity:.85;transition:opacity .35s';
    document.body.appendChild(fl);
    requestAnimationFrame(() => { fl.style.opacity = '0'; setTimeout(() => fl.remove(), 400); });
  }
  if (navigator.vibrate) navigator.vibrate(18);
}

async function addPageFromDataUrl(src, { detect = true, source = 'camera' } = {}) {
  const norm = await normalizeSource(src);
  const page = {
    id: uid('pg'), src: norm, crop: { x: 0, y: 0, w: 1, h: 1 }, rotate: 0,
    quad: null, deskew: 0, detected: false,
    filter: Settings.get('defaultFilter') || 'none', thumb: null, adj: { b: 1, c: 1 }
  };

  // V2 : détection automatique des contours du document
  if (detect && Settings.get('autoDetect') !== false) {
    try {
      const canvas = await ImageOps.render(page, { maxPx: 1200, skipQuad: true });
      const det = Vision.detectQuad(canvas);
      if (det && Vision.acceptQuad(det, source)) {
        page.quad = det.quad;
        page.detected = true;
        // redressement seulement si le gain d'alignement est net (évite de pivoter un document déjà droit)
        try {
          const warped = Vision.warp(canvas, det.quad, { maxPx: 900 });
          const est = Vision.deskewAngleDetailed(warped);
          page.deskew = (Math.abs(est.angle) >= 1 && est.improvement >= 0.15) ? est.angle : 0;
        } catch (e) { page.deskew = 0; }
      }
    } catch (e) { console.warn('[ScanPro] détection', e); }
  }
  page.thumb = await ImageOps.thumb(await ImageOps.render(page, { maxPx: 400, quality: 0.7 }).then(c => c.toDataURL('image/jpeg', 0.7)));
  App.draft.pages.push(page);
  App.draft.active = App.draft.pages.length - 1;
  updateCamPages();
  return page;
}
async function normalizeSource(src) {
  const img = await ImageOps.load(src);
  const maxPx = 2400;
  const scale = Math.min(1, maxPx / Math.max(img.naturalWidth, img.naturalHeight));
  if (scale === 1 && src.length < 2.5e6) return src;
  const c = document.createElement('canvas');
  c.width = Math.round(img.naturalWidth * scale);
  c.height = Math.round(img.naturalHeight * scale);
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
  ctx.drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', 0.9);
}

async function importImagesToDraft(files) {
  if (!files || !files.length) return 0;
  let added = 0;
  for (const f of files) {
    try {
      const { dataUrl } = await ImageOps.fileToDataUrl(f, 2400, 0.9);
      await addPageFromDataUrl(dataUrl, { source: 'import' });
      added++;
    } catch (e) {
      toast(e.message || 'Import impossible', 'err');
    }
  }
  return added;
}

/* =============================================================== ÉDITEUR == */

    <div style="flex:1;overflow:auto;background:var(--bg);padding-bottom:8px;display:flex;flex-direction:column">

        ${d.pages.map((pg, i) => `
          <div class="page-thumb ${i === d.active ? 'on' : ''}" data-act="editor-select-page" data-i="${i}">
