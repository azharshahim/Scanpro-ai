<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<meta name="theme-color" content="#0B1B34">
<meta name="description" content="ScanPro AI — scanner de documents Android : caméra, OCR français/anglais, PDF, 100 % local.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ScanPro AI — Scanner &amp; OCR</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icon.svg">
<style>
/* ==========================================================================
   ScanPro AI — Design system (V1)
   Palette : fond clair, bleu nuit, accents bleus
   ========================================================================== */
:root{
  --navy:#0B1B34;
  --navy-2:#13294B;
  --navy-3:#1E3A63;
  --blue:#2563EB;
  --blue-2:#1D4ED8;
  --blue-soft:#E8F0FE;
  --bg:#F3F6FC;
  --card:#FFFFFF;
  --muted:#64748B;
  --muted-2:#94A3B8;
  --line:#E2E9F4;
  --ok:#10B981;
  --ok-soft:#E7F8F1;
  --warn:#F59E0B;
  --warn-soft:#FEF4E2;
  --danger:#EF4444;
  --danger-soft:#FDECEC;
  --radius:18px;
  --radius-sm:12px;
  --shadow:0 1px 2px rgba(11,27,52,.04), 0 8px 24px -12px rgba(11,27,52,.18);
  --shadow-lg:0 24px 60px -20px rgba(11,27,52,.35);
  --nav-h:74px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
html{background:var(--bg)}
body{
  font-family:var(--font);
  color:var(--navy);
  background:var(--bg);
  font-size:15.5px;
  line-height:1.45;
  overscroll-behavior-y:none;
  min-height:100dvh;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--blue);text-decoration:none}
svg{display:block}
.ico{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ico.sm{width:18px;height:18px}
.ico.lg{width:26px;height:26px}

/* ---------- App shell ---------- */
#app{max-width:600px;margin:0 auto;min-height:100dvh;position:relative;background:var(--bg);
  padding-bottom:calc(var(--nav-h) + var(--safe-b) + 26px)}
.view{animation:viewIn .28s cubic-bezier(.2,.7,.3,1)}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}

/* ---------- Header ---------- */
.appbar{
  position:sticky;top:0;z-index:30;
  background:linear-gradient(160deg,#0B1B34 0%,#13294B 62%,#173A6B 100%);
  color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 14px;
  border-radius:0 0 22px 22px;
  box-shadow:0 10px 30px -16px rgba(11,27,52,.65);
}
.appbar.plain{position:sticky}
.appbar-row{display:flex;align-items:center;gap:10px;min-height:36px}
.appbar h1{font-size:19px;font-weight:700;margin:0;letter-spacing:-.2px;flex:1;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.brand-mark{width:38px;height:38px;border-radius:12px;flex:none;display:grid;place-items:center;
  background:linear-gradient(140deg,#3B82F6,#1D4ED8);box-shadow:0 6px 16px -6px rgba(37,99,235,.9)}
.brand-mark svg{width:21px;height:21px;stroke:#fff}
.brand-name{font-size:18px;font-weight:800;letter-spacing:-.3px;line-height:1.1}
.brand-sub{font-size:11.5px;color:#9DB6DC;letter-spacing:.4px;text-transform:uppercase;font-weight:600}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff;
  background:rgba(255,255,255,.09);transition:background .18s, transform .12s}
.icon-btn:active{transform:scale(.94);background:rgba(255,255,255,.2)}
.icon-btn.light{color:var(--navy);background:#fff;border:1px solid var(--line)}
.hello{margin-top:14px}
.hello h2{font-size:23px;line-height:1.2;margin:0 0 4px;font-weight:750;letter-spacing:-.5px}
.hello p{margin:0;color:#A9BFDF;font-size:13px}
.stat-row{display:flex;gap:8px;margin-top:14px}
.stat{flex:1;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);
  border-radius:14px;padding:9px 12px}
.stat b{display:block;font-size:18px;font-weight:750}
.stat span{font-size:11.5px;color:#A9BFDF;letter-spacing:.2px}
.local-chip{display:inline-flex;align-items:center;gap:6px;margin-top:12px;font-size:11.5px;
  background:rgba(16,185,129,.16);color:#7FE7C0;border:1px solid rgba(16,185,129,.28);
  padding:5px 10px;border-radius:999px;font-weight:600}

/* ---------- Content ---------- */
.content{padding:16px 16px 22px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:22px 2px 10px}
.section-head:first-child{margin-top:6px}
.section-head h2{font-size:16px;font-weight:700;margin:0;letter-spacing:-.2px}
.section-head .link{font-size:13px;font-weight:600;color:var(--blue);background:none;padding:4px}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:12px}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:9px;
  min-height:52px;padding:0 18px;border-radius:15px;font-weight:650;font-size:15.5px;
  transition:transform .12s ease, box-shadow .18s ease, background .18s ease, opacity .18s;
  border:1px solid transparent;width:100%;text-align:center;user-select:none;
}
.btn:active{transform:scale(.977)}
.btn:disabled{opacity:.5;pointer-events:none}
.btn.primary{background:linear-gradient(135deg,#3B82F6,#1D4ED8);color:#fff;
  box-shadow:0 10px 22px -10px rgba(37,99,235,.85)}
.btn.navy{background:var(--navy);color:#fff;box-shadow:0 10px 22px -12px rgba(11,27,52,.8)}
.btn.ghost{background:#fff;color:var(--navy);border-color:var(--line);box-shadow:0 1px 2px rgba(11,27,52,.04)}
.btn.soft{background:var(--blue-soft);color:var(--blue-2)}
.btn.danger{background:var(--danger-soft);color:#B91C1C}
.btn.sm{min-height:42px;font-size:14px;padding:0 14px;border-radius:12px;width:auto}
.btn.xs{min-height:34px;font-size:12.5px;padding:0 11px;border-radius:10px;width:auto;gap:6px;font-weight:600}
.btn.block{width:100%}
.btn-col{display:flex;flex-direction:column;gap:10px}
.btn-row{display:flex;gap:10px}
.btn-row>.btn{flex:1}

/* ---------- Cards ---------- */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
  border:1px solid rgba(226,233,244,.9);overflow:hidden}
.card-pad{padding:16px}
.card-title{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;margin:0 0 4px}
.card-sub{font-size:12.5px;color:var(--muted);margin:0}

/* ---------- Accueil : actions ---------- */
.scan-cta{
  position:relative;overflow:hidden;border-radius:20px;padding:18px;color:#fff;
  background:linear-gradient(135deg,#0B1B34,#17376A 55%,#1D4ED8 130%);
  box-shadow:0 18px 40px -22px rgba(11,27,52,.9);
}
.scan-cta:after{content:"";position:absolute;width:190px;height:190px;border-radius:50%;
  right:-70px;top:-90px;background:radial-gradient(circle,rgba(59,130,246,.55),transparent 70%)}
.scan-cta .cta-top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.cta-badge{width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.14);
  border:1px solid rgba(255,255,255,.18);display:grid;place-items:center;flex:none}
.cta-badge svg{width:24px;height:24px;stroke:#fff}
.scan-cta h3{margin:0;font-size:17px;font-weight:750;letter-spacing:-.2px}
.scan-cta p{margin:2px 0 0;font-size:12.5px;color:#B6CBE8}
.btn-camera{background:#fff;color:var(--navy);min-height:56px;font-weight:750;
  box-shadow:0 12px 26px -14px rgba(0,0,0,.6);position:relative;z-index:1}
.btn-camera .ico{stroke:var(--blue)}
.scan-cta .mini-row{display:flex;gap:8px;margin-top:9px;position:relative;z-index:1}
.scan-cta .mini-row .btn{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.16);
  min-height:44px;font-size:13.5px;font-weight:600;border-radius:12px}
.scan-cta .mini-row .btn:active{background:rgba(255,255,255,.2)}

.quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.quick{display:flex;align-items:center;gap:10px;min-width:0;background:#fff;border:1px solid var(--line);
  border-radius:15px;padding:13px 12px;box-shadow:0 1px 2px rgba(11,27,52,.04);text-align:left;
  transition:transform .12s, box-shadow .18s}
.quick:active{transform:scale(.98)}
.quick .q-ico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none;
  background:var(--blue-soft);color:var(--blue-2)}
.quick b{display:block;font-size:13.5px;font-weight:650;line-height:1.22;white-space:normal}
.quick>span:last-child{display:block;min-width:0}
.quick span{font-size:11.5px;color:var(--muted-2)}

/* ---------- Recherche ---------- */
.search{position:relative;display:flex;align-items:center}
.search svg{position:absolute;left:13px;width:19px;height:19px;stroke:var(--muted-2);pointer-events:none}
.search input{width:100%;min-height:48px;border-radius:14px;border:1px solid var(--line);
  background:#fff;padding:0 42px;font-size:14.5px;outline:none;box-shadow:0 1px 2px rgba(11,27,52,.03);
  transition:border-color .18s, box-shadow .18s}
.search input:focus{border-color:#BFD3F6;box-shadow:0 0 0 4px rgba(37,99,235,.09)}
.search .clear{position:absolute;right:8px;width:32px;height:32px;border-radius:9px;display:grid;
  place-items:center;color:var(--muted);background:#F1F5FB}
.appbar .search{margin-top:14px}
.appbar .search input{border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.1);
  color:#fff;box-shadow:none}
.appbar .search input::placeholder{color:#9DB6DC}
.appbar .search input:focus{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.3);box-shadow:none}
.appbar .search svg{stroke:#9DB6DC}
.appbar .search .clear{background:rgba(255,255,255,.14);color:#fff}

/* ---------- Liste documents ---------- */
.doc-list{display:flex;flex-direction:column;gap:10px}
.doc-item{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);
  border-radius:16px;padding:11px;box-shadow:0 1px 2px rgba(11,27,52,.04);text-align:left;width:100%;
  transition:transform .12s, box-shadow .18s}
.doc-item:active{transform:scale(.99);box-shadow:0 6px 18px -12px rgba(11,27,52,.4)}
.doc-thumb{width:56px;height:72px;border-radius:10px;overflow:hidden;flex:none;background:#EDF2FA;
  display:grid;place-items:center;border:1px solid #EDF2FA;position:relative}
.doc-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.doc-thumb .ico{stroke:var(--muted-2)}
.doc-meta{flex:1;min-width:0}
.doc-meta b{display:block;font-size:14.5px;font-weight:650;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;letter-spacing:-.1px}
.doc-meta .meta-line{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);margin-top:3px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:650;padding:2px 7px;
  border-radius:999px;background:#F1F5FB;color:var(--muted);letter-spacing:.1px}
.tag.ok{background:var(--ok-soft);color:#047857}
.tag.blue{background:var(--blue-soft);color:var(--blue-2)}
.tag.warn{background:var(--warn-soft);color:#B45309}
.doc-row-actions{display:grid;place-items:center;color:var(--muted-2);width:34px;height:34px;
  border-radius:10px;flex:none}
.doc-row-actions:active{background:#F1F5FB}

.empty{text-align:center;padding:34px 18px;background:#fff;border:1px dashed #D8E2F1;border-radius:18px}
.empty .e-ico{width:62px;height:62px;border-radius:20px;background:var(--blue-soft);display:grid;
  place-items:center;margin:0 auto 12px;color:var(--blue)}
.empty h3{margin:0 0 5px;font-size:15px}
.empty p{margin:0;font-size:12.5px;color:var(--muted)}
.empty .btn{margin-top:14px}

/* ---------- Bottom nav ---------- */
.bottom-nav{
  position:fixed;left:0;right:0;bottom:0;z-index:40;max-width:600px;margin:0 auto;
  background:rgba(255,255,255,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--line);display:flex;align-items:stretch;
  padding:8px 10px calc(8px + var(--safe-b));gap:4px;
  box-shadow:0 -8px 24px -18px rgba(11,27,52,.4);
}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--muted-2);font-size:11.5px;font-weight:650;padding:7px 0 5px;border-radius:13px;
  transition:color .18s, background .18s;letter-spacing:.15px;position:relative}
.nav-item .ico{width:23px;height:23px}
.nav-item.active{color:var(--blue-2);background:var(--blue-soft)}
.nav-item.active .ico{stroke:var(--blue-2)}
.nav-fab{flex:none;width:64px;display:grid;place-items:center;margin-top:-26px}
.nav-fab button{width:58px;height:58px;border-radius:20px;display:grid;place-items:center;color:#fff;
  background:linear-gradient(135deg,#3B82F6,#1D4ED8);
  box-shadow:0 14px 26px -12px rgba(37,99,235,.95), 0 0 0 6px rgba(243,246,252,.9);
  transition:transform .12s}
.nav-fab button:active{transform:scale(.93)}
.nav-fab .ico{width:27px;height:27px;stroke-width:1.9}

/* ---------- Écran capture ---------- */
.capture{position:fixed;inset:0;z-index:60;background:#05080F;display:flex;flex-direction:column;
  color:#fff;max-width:600px;margin:0 auto}
.cam-stage{flex:1;position:relative;overflow:hidden;background:#05080F}
.cam-stage video{width:100%;height:100%;object-fit:cover;display:block}
.cam-overlay{position:absolute;inset:0;pointer-events:none;display:grid;place-items:center;padding:26px}
.cam-frame{width:100%;height:100%;max-height:74%;border-radius:16px;position:relative;
  box-shadow:0 0 0 100vmax rgba(3,7,14,.55)}
.cam-frame i{position:absolute;width:34px;height:34px;border:3px solid #7FB2FF;border-radius:4px}
.cam-frame i:nth-child(1){top:-2px;left:-2px;border-right:0;border-bottom:0;border-top-left-radius:16px}
.cam-frame i:nth-child(2){top:-2px;right:-2px;border-left:0;border-bottom:0;border-top-right-radius:16px}
.cam-frame i:nth-child(3){bottom:-2px;left:-2px;border-right:0;border-top:0;border-bottom-left-radius:16px}
.cam-frame i:nth-child(4){bottom:-2px;right:-2px;border-left:0;border-top:0;border-bottom-right-radius:16px}
.cam-hint{position:absolute;left:0;right:0;bottom:14px;text-align:center;padding:0 20px;
  font-size:12.5px;color:#CBD9EE;text-shadow:0 2px 8px #000}
.cam-topbar{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));left:8px;right:8px;
  display:flex;align-items:center;gap:8px;z-index:3}
.cam-topbar .pill{display:inline-flex;align-items:center;gap:6px;background:rgba(11,27,52,.7);
  border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(10px);padding:8px 12px;border-radius:999px;
  font-size:12px;font-weight:650;color:#fff}
.cam-topbar .spacer{flex:1}
.cam-bottom{background:linear-gradient(180deg,rgba(5,8,15,0),#05080F 26%);padding:14px 16px calc(18px + var(--safe-b))}
.shutter-row{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:14px}
.side-action{width:52px;display:flex;flex-direction:column;align-items:center;gap:5px;color:#C7D6EC;
  font-size:10px;font-weight:600}
.side-action .sa-btn{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);color:#fff}
.side-action:active .sa-btn{background:rgba(255,255,255,.22)}
.shutter{width:76px;height:76px;border-radius:50%;background:#fff;display:grid;place-items:center;
  box-shadow:0 0 0 5px rgba(255,255,255,.22);transition:transform .1s}
.shutter:active{transform:scale(.94)}
.shutter i{width:62px;height:62px;border-radius:50%;background:linear-gradient(135deg,#3B82F6,#1D4ED8);
  display:block}
.cam-pages{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.cam-pages::-webkit-scrollbar{display:none}
.cam-page{width:46px;height:60px;border-radius:8px;overflow:hidden;flex:none;border:2px solid rgba(255,255,255,.25);
  position:relative;background:#16233A}
.cam-page img{width:100%;height:100%;object-fit:cover}
.cam-page b{position:absolute;left:2px;top:2px;font-size:9px;background:rgba(0,0,0,.6);border-radius:5px;
  padding:0 4px;line-height:14px}
.cam-warn{margin:0 0 10px;background:rgba(245,158,11,.14);border:1px solid rgba(245,158,11,.35);
  color:#FCD9A0;font-size:12px;padding:9px 11px;border-radius:11px;display:flex;gap:8px;align-items:flex-start}
.cam-warn .ico{stroke:#FCD9A0;flex:none;width:17px;height:17px;margin-top:1px}

/* ---------- Éditeur ---------- */
.editor-wrap{background:#0B1B34;padding-bottom:4px;flex:none}
.editor-stage{position:relative;display:grid;place-items:center;background:#0B1B34;min-height:200px;
  padding:10px 12px;overflow:hidden}
.editor-stage canvas,.editor-stage img{max-width:100%;max-height:38dvh;border-radius:8px;display:block;
  box-shadow:0 18px 40px -20px #000;background:#fff}
.editor-stage .stage-empty{padding:40px 16px;color:#A9BFDF;font-size:13px;text-align:center}
#cropHost{display:inline-block;position:relative;line-height:0;max-width:100%;overflow:hidden;border-radius:8px}
#cropLayer{position:absolute;inset:0;touch-action:none;display:none;overflow:hidden}
#cropLayer.on{display:block}
.crop-toolbar{display:flex;gap:7px;justify-content:center;padding:0 10px 10px;flex-wrap:nowrap}
.crop-toolbar .btn{width:auto;min-height:36px;font-size:12.5px;padding:0 11px;border-radius:11px;white-space:nowrap;
  background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.16)}
.crop-toolbar .btn.go{background:#2563EB;border-color:#2563EB}
.filters{display:flex;gap:8px;padding:12px 16px 4px;overflow-x:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:7px;min-height:40px;padding:0 14px;border-radius:12px;
  background:#fff;border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--navy);
  white-space:nowrap;flex:none;transition:background .15s,color .15s,border-color .15s}
.chip .dot{width:12px;height:12px;border-radius:4px;border:1px solid rgba(11,27,52,.15)}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.chip:active{transform:scale(.97)}
.chip.sm{min-height:32px;font-size:12px;padding:0 11px;border-radius:10px}
.tool-row{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 2px;scrollbar-width:none}
.tool-row::-webkit-scrollbar{display:none}
.tool{flex:none;display:flex;flex-direction:column;align-items:center;gap:5px;width:72px;
  padding:9px 4px;border-radius:13px;background:#fff;border:1px solid var(--line);font-size:11.5px;
  font-weight:600;color:var(--navy);text-align:center;line-height:1.15}
.tool:active{background:#F1F5FB}
.tool .ico{stroke:var(--blue-2)}
.pages-strip{display:flex;gap:9px;overflow-x:auto;padding:12px 16px 6px;scrollbar-width:none}
.pages-strip::-webkit-scrollbar{display:none}
.page-thumb{width:68px;flex:none;position:relative;text-align:center}
.page-thumb .pt-img{width:68px;height:88px;border-radius:9px;overflow:hidden;border:2px solid transparent;
  background:#EDF2FA;display:grid;place-items:center;position:relative}
.page-thumb.on .pt-img{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.18)}
.page-thumb img{width:100%;height:100%;object-fit:cover}
.page-thumb span{display:block;font-size:10.5px;color:var(--muted);margin-top:4px;font-weight:600}
.page-thumb.on span{color:var(--blue-2)}
.page-thumb .del{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;
  background:#fff;color:var(--danger);border:1px solid var(--line);display:grid;place-items:center;
  box-shadow:0 2px 6px rgba(11,27,52,.16)}
.page-thumb .del .ico{width:13px;height:13px;stroke-width:2.4}
.add-page{width:68px;height:88px;border-radius:9px;border:1.5px dashed #C6D5EA;display:grid;
  place-items:center;background:#fff;color:var(--blue);flex:none;margin-top:0}

.sticky-actions{position:sticky;bottom:0;z-index:20;margin-top:auto;
  display:flex;gap:9px;background:rgba(243,246,252,.96);backdrop-filter:blur(10px);
  padding:10px 16px calc(12px + var(--safe-b));border-top:1px solid var(--line)}
.sticky-actions .btn{min-height:48px;font-size:14.5px}

/* ---------- Détail document ---------- */
.detail-tabs{display:flex;gap:6px;background:#EAF0F9;padding:4px;border-radius:13px;margin:0 0 14px}
.detail-tabs button{flex:1;min-height:38px;border-radius:10px;font-size:12.5px;font-weight:650;
  color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px}
.detail-tabs button.on{background:#fff;color:var(--navy);box-shadow:0 2px 6px -2px rgba(11,27,52,.2)}
.detail-tabs .ico{width:16px;height:16px}
.preview-box{background:#fff;border-radius:16px;border:1px solid var(--line);padding:10px;
  display:grid;place-items:center;min-height:150px;overflow:hidden}
.preview-box img{max-width:100%;max-height:52dvh;border-radius:8px;box-shadow:0 8px 20px -14px rgba(11,27,52,.6)}
.preview-nav{display:flex;align-items:center;justify-content:space-between;margin-top:10px;font-size:12.5px;
  color:var(--muted);font-weight:600}
.preview-nav .btn{width:auto}
.textarea{width:100%;min-height:260px;border-radius:14px;border:1px solid var(--line);padding:13px;
  font-size:14px;line-height:1.6;resize:vertical;background:#fff;outline:none;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.textarea:focus{border-color:#BFD3F6;box-shadow:0 0 0 4px rgba(37,99,235,.09)}
.text-meta{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:9px 2px 0;
  font-size:11.5px;color:var(--muted)}
.ai-out{background:#FBFCFF;border:1px solid var(--line);border-radius:12px;padding:12px;
  font-size:13.5px;line-height:1.55;white-space:pre-wrap;word-break:break-word;min-height:56px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:7px 12px;font-size:12.5px;margin:0}
.kv dt{color:var(--muted);font-weight:600}
.kv dd{margin:0;font-weight:600;word-break:break-word}
.ai-note{display:flex;gap:9px;background:var(--warn-soft);border:1px solid #F7DFB0;color:#8A5A08;
  padding:10px 12px;border-radius:12px;font-size:12px;line-height:1.45}
.ai-note .ico{stroke:#B45309;flex:none;margin-top:1px}
.ai-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.ai-card h4{margin:0 0 8px;font-size:13.5px;display:flex;align-items:center;gap:7px}
.ai-card h4 .ico{stroke:var(--blue-2)}
.soon{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;letter-spacing:.4px;
  text-transform:uppercase;color:#8A5A08;background:var(--warn-soft);padding:2px 7px;border-radius:999px}

/* ---------- Paramètres ---------- */
.set-group{background:#fff;border-radius:16px;border:1px solid var(--line);overflow:hidden;margin-bottom:12px;
  box-shadow:0 1px 2px rgba(11,27,52,.04)}
.set-group h3{margin:0;padding:13px 15px 7px;font-size:11.5px;text-transform:uppercase;letter-spacing:.7px;
  color:var(--muted-2);font-weight:750}
.set-row{display:flex;align-items:center;gap:12px;padding:12px 15px;min-height:56px;width:100%;
  text-align:left;border-top:1px solid #F1F5FB}
.set-group h3 + .set-row{border-top:0}
.set-row .s-ico{width:36px;height:36px;border-radius:10px;background:#F3F7FD;display:grid;place-items:center;
  color:var(--navy-2);flex:none}
.set-row .s-body{flex:1;min-width:0}
.set-row b{display:block;font-size:14px;font-weight:600}
.set-row span{display:block;font-size:11.5px;color:var(--muted);margin-top:1px}
.set-row .chev{color:var(--muted-2)}
.switch{width:46px;height:28px;border-radius:999px;background:#DCE5F1;position:relative;flex:none;
  transition:background .2s}
.switch:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;
  background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.24);transition:transform .2s}
.switch.on{background:var(--blue)}
.switch.on:after{transform:translateX(18px)}
.meter{height:8px;border-radius:999px;background:#EDF2FA;overflow:hidden;margin:8px 0 4px}
.meter i{display:block;height:100%;background:linear-gradient(90deg,#3B82F6,#1D4ED8);border-radius:999px;
  transition:width .3s}
.about{text-align:center;padding:18px 12px 6px;color:var(--muted-2);font-size:11.5px;line-height:1.6}

.subnav{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.subnav h2{font-size:20px;margin:0;font-weight:750;letter-spacing:-.4px;flex:1}

/* ---------- Modales / feuilles ---------- */
.backdrop{position:fixed;inset:0;background:rgba(6,14,28,.5);backdrop-filter:blur(3px);z-index:80;

@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{width:100%;max-width:600px;background:#fff;border-radius:22px 22px 0 0;padding:8px 16px

#toasts{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + var(--safe-b) + 14px);z-index:120;

.toast.err{background:#7F1D1D}.toast.err .ico{stroke:#FCA5A5}
@keyframes toastIn{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}

.busy{position:relative;pointer-events:none;opacity:.7}

.spinner.dark{border-color:rgba(11,27,52,.18);border-top-color:var(--blue)}
@keyframes spin{to{transform:rotate(360deg)}}
.ocr-bar{height:6px;border-radius:99px;background:#EAF0F9;overflow:hidden;margin:8px 0 2px}
.ocr-bar i{display:block;height:100%;background:linear-gradient(90deg,#3B82F6,#1D4ED8);width:0;
  transition:width .25s}
.banner{display:flex;gap:10px;padding:11px 13px;border-radius:13px;font-size:12.5px;line-height:1.45;
  align-items:flex-start;margin-bottom:12px}
.banner .ico{flex:none;margin-top:1px}
.banner.info{background:var(--blue-soft);color:#1E40AF;border:1px solid #CFDFFB}

.hr{height:1px;background:var(--line);margin:14px 0;border:0}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.text-center{text-align:center}
.mt0{margin-top:0}.mt6{margin-top:6px}.mt10{margin-top:10px}.mt14{margin-top:14px}.mt20{margin-top:20px}

  const d = new Date(ts), now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  const hm = d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
  if (sameDay) return "Aujourd'hui, " + hm;
  const yest = new Date(now); yest.setDate(now.getDate() - 1);
  if (d.toDateString() === yest.toDateString()) return 'Hier, ' + hm;
  return d.toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', year: d.getFullYear() === now.getFullYear() ? undefined : 'numeric' }) + ', ' + hm;
}
function slugify(s) {
  return (s || 'scan').normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-zA-Z0-9 _-]/g, '').trim().replace(/\s+/g, '-').slice(0, 60) || 'scan';
}
const plural = (n, s, p) => n + ' ' + (n > 1 ? p : s);

/* --------------------------------------------------------------- stockage -- */
const DB_NAME = 'scanpro-ai', DB_VER = 1;
const Store = {
  _db: null,
  _mem: { docs: new Map(), pages: new Map(), kv: new Map(), files: new Map() },
  _fallback: false,

  async open() {
    if (this._db) return this._db;
    try {
      this._db = await new Promise((res, rej) => {
        const req = indexedDB.open(DB_NAME, DB_VER);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains('docs')) db.createObjectStore('docs', { keyPath: 'id' });
          if (!db.objectStoreNames.contains('pages')) {
            const ps = db.createObjectStore('pages', { keyPath: 'id' });
            ps.createIndex('docId', 'docId');
          }
          if (!db.objectStoreNames.contains('kv')) db.createObjectStore('kv', { keyPath: 'k' });
          if (!db.objectStoreNames.contains('files')) db.createObjectStore('files', { keyPath: 'id' });
        };
        req.onsuccess = () => res(req.result);
        req.onerror = () => rej(req.error);
        req.onblocked = () => rej(new Error('IndexedDB bloquée (autre onglet ouvert ?)'));
      });
      return this._db;
    } catch (e) {
      console.warn('[Store] IndexedDB indisponible, mode mémoire :', e);
      this._fallback = true;
      return null;
    }
  },
  async tx(storeName, mode = 'readonly') {
    const db = await this.open();
    if (!db) return null;
    return db.transaction(storeName, mode).objectStore(storeName);
  },
  async put(storeName, value) {
    const os = await this.tx(storeName, 'readwrite');
    if (!os) { this._mem[storeName].set(value[storeName === 'kv' ? 'k' : 'id'], value); return; }
    await new Promise((res, rej) => {
      const r = os.put(value);
      r.onsuccess = () => res(); r.onerror = () => rej(r.error);
    });
  },
  async get(storeName, key) {
    const os = await this.tx(storeName);
    if (!os) return this._mem[storeName].get(key);
    return new Promise((res, rej) => {
      const r = os.get(key);
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
  },
  async del(storeName, key) {
    const os = await this.tx(storeName, 'readwrite');
    if (!os) { this._mem[storeName].delete(key); return; }
    return new Promise((res, rej) => {
      const r = os.delete(key);
      r.onsuccess = () => res(); r.onerror = () => rej(r.error);
    });
  },
  async all(storeName) {
    const os = await this.tx(storeName);
    if (!os) return Array.from(this._mem[storeName].values());
    return new Promise((res, rej) => {
      const r = os.getAll();
      r.onsuccess = () => res(r.result || []); r.onerror = () => rej(r.error);
    });
  },
  async byDoc(docId) {
    const os = await this.tx('pages');
    if (!os) return Array.from(this._mem.pages.values()).filter(p => p.docId === docId);
    return new Promise((res, rej) => {
      const r = os.index('docId').getAll(docId);
      r.onsuccess = () => res(r.result || []); r.onerror = () => rej(r.error);
    });
  },
  async clearAll() {
    for (const s of ['docs', 'pages', 'kv', 'files']) {
      const os = await this.tx(s, 'readwrite');
      if (os) await new Promise(res => { const r = os.clear(); r.onsuccess = r.onerror = () => res(); });
      else this._mem[s].clear();
    }
  },
  get isFallback() { return this._fallback; }
};

/* ---------------------------------------------------------- image helpers -- */
const ImageOps = {
  load(src) {
    return new Promise((res, rej) => {
      const im = new Image();
      im.onload = () => res(im);
      im.onerror = () => rej(new Error("Image illisible ou format non pris en charge"));
      im.src = src;
    });
  },
  /** Redimensionne un fichier image en dataURL JPEG (limite de mémoire). */
  async fileToDataUrl(file, maxPx = 2400, quality = 0.9) {
    if (!file) throw new Error('Fichier manquant');
    if (file.type && !/^image\//.test(file.type)) throw new Error('Format non pris en charge : ' + (file.type || 'inconnu'));
    let src;
    try { src = URL.createObjectURL(file); } catch (e) { src = await this.fileToDataUrlLegacy(file); }
    const img = await this.load(src);
    const scale = Math.min(1, maxPx / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(img.naturalWidth * scale));
    c.height = Math.max(1, Math.round(img.naturalHeight * scale));
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
    ctx.drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(src);
    return { dataUrl: c.toDataURL('image/jpeg', quality), w: c.width, h: c.height };
  },
  fileToDataUrlLegacy(file) {
    return new Promise((res, rej) => {
      const fr = new FileReader();
      fr.onload = () => res(fr.result); fr.onerror = () => rej(new Error('Lecture du fichier impossible'));
      fr.readAsDataURL(file);
    });
  },
  /** Rendu d'une page du brouillon / document : crop + rotation + filtre. */
  async render(page, { maxPx = 2400, quality = 0.9 } = {}) {
    const img = await this.load(page.src);
    const crop = page.crop || { x: 0, y: 0, w: 1, h: 1 };
    const sx = clamp(crop.x, 0, 1) * img.naturalWidth;
    const sy = clamp(crop.y, 0, 1) * img.naturalHeight;
    const sw = Math.max(2, clamp(crop.w, 0.02, 1) * img.naturalWidth);
    const sh = Math.max(2, clamp(crop.h, 0.02, 1) * img.naturalHeight);
    const rot = ((Math.round((page.rotate || 0) / 90) * 90) % 360 + 360) % 360;
    const swap = rot === 90 || rot === 270;
    const scale = Math.min(1, maxPx / Math.max(sw, sh));
    const cw = Math.max(1, Math.round(sw * scale));
    const ch = Math.max(1, Math.round(sh * scale));
    const c = document.createElement('canvas');
    c.width = swap ? ch : cw;
    c.height = swap ? cw : ch;
    const ctx = c.getContext('2d');
    ctx.imageSmoothingQuality = 'high';
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
    ctx.save();
    ctx.translate(c.width / 2, c.height / 2);
    ctx.rotate(rot * Math.PI / 180);
    ctx.drawImage(img, sx, sy, sw, sh, -cw / 2, -ch / 2, cw, ch);
    ctx.restore();
    const f = page.filter || 'none';
    if (f !== 'none' && f !== 'original') this.filter(c, f);
    return c;
  },
  dataUrl(canvas, quality = 0.9) { return canvas.toDataURL('image/jpeg', quality); },

  /* ---------- filtres pixel ---------- */
  filter(canvas, mode) {
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const W = canvas.width, H = canvas.height;
    const id = ctx.getImageData(0, 0, W, H);
    const d = id.data;
    const n = W * H;
    const gray = new Uint8ClampedArray(n);
    for (let i = 0, j = 0; i < d.length; i += 4, j++) {
      gray[j] = (d[i] * 0.299 + d[i + 1] * 0.587 + d[i + 2] * 0.114) | 0;
    }
    if (mode === 'gray') {
      for (let i = 0, j = 0; i < d.length; i += 4, j++) { const v = gray[j]; d[i] = d[i + 1] = d[i + 2] = v; }
    } else if (mode === 'color') {
      // auto-niveaux par canal (2 % / 98 %)
      const hist = [new Uint32Array(256), new Uint32Array(256), new Uint32Array(256)];
      for (let i = 0; i < d.length; i += 4) { hist[0][d[i]]++; hist[1][d[i + 1]]++; hist[2][d[i + 2]]++; }
      const lo = [], hi = [];
      for (let k = 0; k < 3; k++) {
        let acc = 0, l = 0, h = 255;
        const lim = n * 0.02;
        for (; l < 256; l++) { acc += hist[k][l]; if (acc > lim) break; }
        acc = 0;
        for (h = 255; h > 0; h--) { acc += hist[k][h]; if (acc > lim) break; }
        lo[k] = l; hi[k] = h;
      }
      for (let i = 0; i < d.length; i += 4) {
        d[i]     = clamp((d[i] - lo[0]) * 255 / Math.max(1, hi[0] - lo[0]), 0, 255);
        d[i + 1] = clamp((d[i + 1] - lo[1]) * 255 / Math.max(1, hi[1] - lo[1]), 0, 255);
        d[i + 2] = clamp((d[i + 2] - lo[2]) * 255 / Math.max(1, hi[2] - lo[2]), 0, 255);
      }
      this._sharpen(d, W, H, 0.35);
    } else if (mode === 'doc') {
      // niveaux + contraste doux sur niveaux de gris, rendu "photocopie propre"
      const hist = new Uint32Array(256);
      for (let j = 0; j < n; j++) hist[gray[j]]++;
      let acc = 0, lo = 0, hi = 255; const lim = n * 0.03;
      for (; lo < 256; lo++) { acc += hist[lo]; if (acc > lim) break; }
      acc = 0;
      for (hi = 255; hi > 0; hi--) { acc += hist[hi]; if (acc > lim) break; }
      const span = Math.max(1, hi - lo);
      for (let j = 0, i = 0; j < n; j++, i += 4) {
        let v = (gray[j] - lo) * 255 / span;
        v = v < 0 ? 0 : v > 255 ? 255 : v;
        v = 255 * Math.pow(v / 255, 1.28);           // courbe : blancs plus blancs
        v = clamp(v, 0, 255);
        d[i] = d[i + 1] = d[i + 2] = v;
      }
      this._sharpen(d, W, H, 0.55);
    } else if (mode === 'bw') {
      // seuillage adaptatif (moyenne locale via image intégrale)
      const integ = new Float64Array((W + 1) * (H + 1));
      for (let y = 0; y < H; y++) {
        let rowSum = 0;
        for (let x = 0; x < W; x++) {
          rowSum += gray[y * W + x];
          integ[(y + 1) * (W + 1) + (x + 1)] = integ[y * (W + 1) + (x + 1)] + rowSum;
        }
      }
      const r = Math.max(6, Math.round(Math.min(W, H) * 0.045));
      const C = 12;
      for (let y = 0; y < H; y++) {
        const y0 = Math.max(0, y - r), y1 = Math.min(H - 1, y + r);
        for (let x = 0; x < W; x++) {
          const x0 = Math.max(0, x - r), x1 = Math.min(W - 1, x + r);
          const area = (x1 - x0 + 1) * (y1 - y0 + 1);
          const sum = integ[(y1 + 1) * (W + 1) + (x1 + 1)] - integ[y0 * (W + 1) + (x1 + 1)]
                    - integ[(y1 + 1) * (W + 1) + x0] + integ[y0 * (W + 1) + x0];
          const mean = sum / area;
          const i = (y * W + x) * 4;
          const v = gray[y * W + x] < mean - C ? 0 : 255;
          d[i] = d[i + 1] = d[i + 2] = v;
        }
      }
    }
    ctx.putImageData(id, 0, 0);
  },
  _sharpen(d, W, H, amount) {
    const src = new Uint8ClampedArray(d.length);
    src.set(d);
    const k = amount;
    for (let y = 1; y < H - 1; y++) {
      for (let x = 1; x < W - 1; x++) {
        const i = (y * W + x) * 4;
        for (let c = 0; c < 3; c++) {
          const p = i + c;
          const center = src[p] * (1 + 4 * k);
          const around = (src[p - 4] + src[p + 4] + src[p - W * 4] + src[p + W * 4]) * k;
          d[p] = clamp(center - around, 0, 255);
        }
      }
    }
  },
  /** Redimensionne un dataURL en vignette carrée (pour les listes). */
  async thumb(src, w = 140, h = 180) {
    try {
      const img = await this.load(src);
      const scale = Math.max(w / img.naturalWidth, h / img.naturalHeight);
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
      const dw = img.naturalWidth * scale, dh = img.naturalHeight * scale;
      ctx.drawImage(img, (w - dw) / 2, (h - dh) / 2, dw, dh);
      return c.toDataURL('image/jpeg', 0.7);
    } catch (e) { return null; }
  }
};

/* -------------------------------------------------------------------- OCR -- */
/* Certains hébergeurs (aperçus GitHub, githack, etc.) bloquent les gros fichiers
   binaires. On sonde les fichiers locaux puis on bascule, si besoin, sur le CDN
   jsDelivr du dépôt public. En local (http://localhost) rien ne change. */
const CDN_VENDOR = 'https://cdn.jsdelivr.net/gh/azharshahim/Scanpro-ai@main/vendor/';
/* Un Web Worker ne peut pas être instancié depuis une URL d'un autre domaine.
   On charge alors le script du worker en Blob (jsDelivr/Pages autorisent le CORS). */
const Assets = {
  _base: null,
  localBase() { return new URL('vendor/', location.href).href; },
  async base() {
    if (this._base) return this._base;
    const local = this.localBase();
    if (location.protocol === 'file:' || navigator.onLine === false) return (this._base = local);
    try {
      const r = await fetch(local + 'lang/fra.traineddata.gz', { method: 'HEAD', cache: 'no-store' });
      this._base = r.ok ? local : CDN_VENDOR;
    } catch (e) { this._base = CDN_VENDOR; }
    if (this._base === CDN_VENDOR) console.info('[Assets] fichiers locaux indisponibles → CDN jsDelivr');
    return this._base;
  },
  async ensureLoaded() {
    await this.base();
    const onCdn = this._base === CDN_VENDOR;
    const needed = [
      ['tesseract.min.js', () => OCR.available()],
      ['jspdf.umd.min.js', () => PDF.hasJsPDF()],
      ['pdf-lib.min.js', () => PDF.hasPdfLib()],
      ['pdf.min.js', () => typeof pdfjsLib !== 'undefined'],
      ['jszip.min.js', () => typeof JSZip !== 'undefined']
    ];
    for (const [file, ok] of needed) {
      if (ok()) continue;
      await new Promise((res) => {
        const sc = document.createElement('script');
        sc.src = (onCdn ? CDN_VENDOR : this.localBase()) + file;
        sc.onload = sc.onerror = () => res();
        document.head.appendChild(sc);
      });
    }
  }
};

const OCR = {
  worker: null, langs: null, busy: false,
  available: () => typeof Tesseract !== 'undefined',
  corePath() { return Assets._base || this.localCore(); },
  localCore() { return new URL('vendor/', location.href).href; },
  langPath() { return (Assets._base || this.localCore()) + 'lang'; },
  workerPath() { return (Assets._base || this.localCore()) + 'tesseract-worker.min.js'; },

  async ensure(langs = 'fra+eng', onProgress) {
    if (!this.available()) await Assets.ensureLoaded();
    if (!this.available()) throw new Error("Le moteur OCR n'a pas pu être chargé (tesseract.min.js absent ou bloqué).");
    if (this.worker && this.langs === langs) return this.worker;
    if (this.worker) { try { await this.worker.terminate(); } catch (e) {} this.worker = null; }
    onProgress && onProgress({ status: 'initialisation du moteur OCR', progress: 0.02 });
    const crossOrigin = !this.workerPath().startsWith(location.origin);
    const fileMode = location.protocol === 'file:';
    this.worker = await Tesseract.createWorker(langs, 1, {
      workerPath: this.workerPath(),
      corePath: this.corePath(),
      langPath: this.langPath(),
      workerBlobURL: crossOrigin && !fileMode,
      logger: (m) => onProgress && onProgress(m),
      errorHandler: (e) => console.warn('[OCR]', e)
    });
    try {
      await this.worker.setParameters({ preserve_interword_spaces: '1' });
    } catch (e) { /* non bloquant */ }
    this.langs = langs;
    return this.worker;
  },
  /** '@@' : moteur OCR indisponible, message clair côté UI. */
  async run(dataUrl, langs, onProgress) {
    const w = await this.ensure(langs, onProgress);
    const { data } = await w.recognize(dataUrl);
    const text = (data.text || '').replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim();
    return { text, confidence: Math.round(data.confidence || 0), words: (data.words || []).length, lines: (data.lines || []).length };
  },
  async terminate() { if (this.worker) { try { await this.worker.terminate(); } catch (e) {} this.worker = null; this.langs = null; } }
};

/* -------------------------------------------------------------------- PDF -- */
const PDF = {
  hasJsPDF: () => !!(window.jspdf && window.jspdf.jsPDF),
  hasPdfLib: () => typeof window.PDFLib !== 'undefined',

  /** Construit un PDF A4 à partir des pages (image par page). */
  async build(pages, { name = 'scan', quality = 0.88, maxPx = 2400, onProgress } = {}) {
    if (!this.hasJsPDF()) await Assets.ensureLoaded();
    if (!this.hasJsPDF()) throw new Error('La bibliothèque PDF (jsPDF) est indisponible.');
    if (!pages.length) throw new Error('Aucune page à exporter.');
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ unit: 'mm', format: 'a4', compress: true, orientation: 'portrait' });
    const PW = 210, PH = 297, M = 8;
    for (let i = 0; i < pages.length; i++) {
      onProgress && onProgress((i) / pages.length, `Mise en page ${i + 1}/${pages.length}`);
      const canvas = await ImageOps.render(pages[i], { maxPx, quality: 0.95 });
      const data = canvas.toDataURL('image/jpeg', quality);
      const availW = PW - M * 2, availH = PH - M * 2;
      const ratio = canvas.width / canvas.height;
      let w = availW, h = w / ratio;
      if (h > availH) { h = availH; w = h * ratio; }
      if (i > 0) pdf.addPage('a4', 'portrait');
      pdf.addImage(data, 'JPEG', (PW - w) / 2, (PH - h) / 2, w, h, 'p' + i, 'FAST');
    }
    onProgress && onProgress(1, 'Finalisation');
    return { blob: pdf.output('blob'), base64: null };
  },

  /** Fusionne plusieurs PDF (octets) en un seul. */
  async merge(files, { name = 'fusion' } = {}) {
    if (!this.hasPdfLib()) await Assets.ensureLoaded();
    if (!this.hasPdfLib()) throw new Error('La bibliothèque pdf-lib est indisponible.');
    const { PDFDocument } = window.PDFLib;
    const out = await PDFDocument.create();
    let added = 0;
    for (const f of files) {
      const bytes = f.bytes instanceof Uint8Array ? f.bytes : new Uint8Array(f.bytes);
      let src;
      try { src = await PDFDocument.load(bytes, { ignoreEncryption: true }); }
      catch (e) { throw new Error('PDF illisible ou protégé : ' + (f.name || 'fichier')); }
      const idx = await out.copyPages(src, src.getPageIndices());
      idx.forEach(p => { out.addPage(p); added++; });
    }
    if (!added) throw new Error('Aucune page PDF trouvée.');
    out.setTitle(name);
    out.setProducer('ScanPro AI');
    const bytes = await out.save();
    return { blob: new Blob([bytes], { type: 'application/pdf' }), pageCount: added };
  },

  /** Lit un PDF (nb de pages) et rend la 1re page en vignette. */
  async inspect(file) {
    if (typeof pdfjsLib === 'undefined') await Assets.ensureLoaded();
    if (typeof pdfjsLib === 'undefined') return { pageCount: 0, thumb: null };
    try {
      const buf = await file.arrayBuffer();
      pdfjsLib.GlobalWorkerOptions.workerSrc = new URL('vendor/pdf.worker.min.js', location.href).href;
      const doc = await pdfjsLib.getDocument({ data: buf }).promise;
      let thumb = null;
      const p = await doc.getPage(1);
      const vp = p.getViewport({ scale: 1 });
      const scale = 320 / Math.max(vp.width, vp.height);
      const v = p.getViewport({ scale });
      const c = document.createElement('canvas');
      c.width = Math.round(v.width); c.height = Math.round(v.height);
      await p.render({ canvasContext: c.getContext('2d'), viewport: v }).promise;
      thumb = c.toDataURL('image/jpeg', 0.75);
      return { pageCount: doc.numPages, thumb };
    } catch (e) {
      console.warn('[PDF] inspect', e);
      return { pageCount: 0, thumb: null, error: e.message };
    }
  }
};

/* ---------------------------------------------------------- file helpers -- */
function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.rel = 'noopener';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 20000);
}
function dataUrlToBlob(dataUrl) {
  const [meta, b64] = dataUrl.split(',');
  const mime = (meta.match(/:(.*?);/) || [])[1] || 'image/jpeg';
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime });
}
async function shareFile(blob, filename, title = 'ScanPro AI') {
  if (!navigator.share) throw new Error("Le partage natif n'est pas disponible sur ce navigateur.");
  const file = new File([blob], filename, { type: blob.type || 'application/octet-stream' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    await navigator.share({ files: [file], title, text: title });
    return 'shared';
  }
  throw new Error("Ce navigateur ne peut pas partager ce type de fichier. Utilisez « Télécharger ».");
}
function pickFiles({ accept = 'image/*', multiple = true, capture = null } = {}) {
  return new Promise(res => {
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = accept; inp.multiple = multiple;
    if (capture) inp.capture = capture;
    inp.style.position = 'fixed'; inp.style.left = '-9999px';
    document.body.appendChild(inp);
    inp.addEventListener('change', () => {
      const files = Array.from(inp.files || []);
      inp.remove();
      res(files);
    }, { once: true });
    // si l'utilisateur annule, on nettoie au prochain focus
    window.addEventListener('focus', () => setTimeout(() => { if (document.body.contains(inp)) inp.remove(); }, 1500), { once: true });
    inp.click();
  });
}

/* ----------------------------------------------------------- stockage info -- */
async function storageInfo() {
  let usage = null, quota = null;
  try {
    if (navigator.storage && navigator.storage.estimate) {
      const est = await navigator.storage.estimate();
      usage = est.usage || 0; quota = est.quota || 0;
    }
  } catch (e) {}
  return { usage, quota, fallback: Store.isFallback };
}

<script>
/* =============================================================================
 * ScanPro AI — état global, dépôt de documents, UI shell (toasts, feuilles)
 * ========================================================================== */
'use strict';

/* ------------------------------------------------------------- préférences -- */
const Settings = {
  k: 'scanpro.settings.v1',
  defaults: { ocrLangs: 'fra+eng', quality: 'high', defaultFilter: 'doc', autoOcr: false, seenOnboarding: false },
  data: null,
  load() {
    try { this.data = Object.assign({}, this.defaults, JSON.parse(localStorage.getItem(this.k) || '{}')); }
    catch (e) { this.data = Object.assign({}, this.defaults); }
    return this.data;
  },
  get(key) { if (!this.data) this.load(); return this.data[key]; },
  set(key, val) {
    if (!this.data) this.load();
    this.data[key] = val;
    try { localStorage.setItem(this.k, JSON.stringify(this.data)); } catch (e) {}
  }
};

/* ------------------------------------------------------------------- état -- */
const App = {
  route: 'home',
  param: null,
  docs: [],            // métadonnées
  search: '',
  docFilter: 'all',
  draft: null,         // {docId?, name, pages:[{id,src,crop,rotate,filter}], active, cropMode, cropRect}
  doc: null,           // document ouvert
  docPages: [],
  detailTab: 'preview',
  detailPage: 0,
  camera: { stream: null, facing: 'environment', torch: false },
  ocrText: {},
  ready: false
};

/* ------------------------------------------------------- toasts / overlay -- */
function toast(msg, type = '', ms = 2600) {
  const host = $('#toasts');
  const icons = { ok: 'i-check', err: 'i-alert' };
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.innerHTML = `<svg class="ico sm"><use href="#${icons[type] || 'i-info'}"/></svg><span>${escapeHtml(msg)}</span>`;
  host.appendChild(el);
  while (host.children.length > 2) host.firstElementChild.remove();
  setTimeout(() => {
    el.style.transition = 'opacity .25s, transform .25s';
    el.style.opacity = '0'; el.style.transform = 'translateY(8px)';
    setTimeout(() => el.remove(), 260);
  }, ms);
  return el;
}
const busyBar = (on) => $('#progress').classList.toggle('on', !!on);

function openSheet({ title = '', sub = '', body = '', actions = [], onMount = null, full = false }) {
  closeSheet();
  const root = $('#modalRoot');
  const back = document.createElement('div');
  back.className = 'backdrop';
  back.innerHTML = `
    <div class="sheet" role="dialog" aria-modal="true" aria-label="${escapeHtml(title || 'Dialogue')}">
      <div class="grab"></div>
      ${title ? `<h3>${escapeHtml(title)}</h3>` : ''}
      ${sub ? `<p class="sub">${sub}</p>` : ''}
      <div class="sheet-body">${body}</div>
      ${actions.length ? `<div class="sheet-actions">
        ${actions.map(a => `<button class="btn ${a.cls || 'ghost'}" ${a.act ? `data-act="${a.act}"` : ''}
          ${a.close !== false ? 'data-close="1"' : ''}>${a.label}</button>`).join('')}
      </div>` : ''}
    </div>`;
  root.appendChild(back);
  back.addEventListener('click', (e) => { if (e.target === back) closeSheet(); });
  back.addEventListener('click', (e) => { if (e.target.closest('[data-close]')) closeSheet(); });
  if (onMount) onMount(back.querySelector('.sheet'));
  return back.querySelector('.sheet');
}
function closeSheet() { const r = $('#modalRoot'); if (r) r.innerHTML = ''; }

function confirmSheet({ title, sub, okLabel = 'Confirmer', danger = false, onOk }) {
  openSheet({
    title, sub,
    actions: [
      { label: 'Annuler', cls: 'ghost' },
      { label: okLabel, cls: danger ? 'danger' : 'primary', act: 'confirm-ok', close: true }
    ],
    onMount: (sheet) => {
      const b = $('[data-act="confirm-ok"]', sheet);
      b.addEventListener('click', () => setTimeout(() => onOk && onOk(), 0), { once: true });
    }
  });
}
function promptSheet({ title, label = 'Nom', value = '', sub = '', okLabel = 'Enregistrer', onOk }) {
  const s = openSheet({
    title, sub,
    body: `<div class="field"><label for="__p">${escapeHtml(label)}</label>
      <input id="__p" value="${escapeHtml(value)}" autocomplete="off" enterkeyhint="done"></div>`,
    actions: [{ label: 'Annuler', cls: 'ghost' }, { label: okLabel, cls: 'primary', act: 'prompt-ok', close: true }],
    onMount: (sheet) => {
      const inp = $('#__p', sheet);
      setTimeout(() => { inp.focus(); inp.select(); }, 60);
      const go = () => { const v = inp.value.trim(); if (v) onOk && onOk(v); };
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); go(); closeSheet(); } });
      $('[data-act="prompt-ok"]', sheet).addEventListener('click', () => setTimeout(go, 0), { once: true });
    }
  });
  return s;
}

/* ------------------------------------------------------------ dépôt docs -- */
const Repo = {
  async list() {
    const docs = await Store.all('docs');
    return docs.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  },
  async create({ name = 'Document', pages = [], file = null, thumb = null, source = 'scan' }) {
    const now = Date.now();
    const doc = {
      id: uid('doc'), name, createdAt: now, updatedAt: now,
      pageCount: pages.length, thumb: thumb || (pages[0] ? pages[0].thumb : null),
      text: '', ocr: { status: pages.length ? 'none' : 'none', at: null, confidence: 0 },
      bytes: 0, source, modified: false, kind: file ? 'pdf' : 'scan'
    };
    let bytes = 0;
    for (let i = 0; i < pages.length; i++) {
      const p = pages[i];
      const rec = {
        id: p.id || uid('pg'), docId: doc.id, index: i, src: p.src,
        crop: p.crop || { x: 0, y: 0, w: 1, h: 1 }, rotate: p.rotate || 0,
        filter: p.filter || 'none', thumb: p.thumb || null, text: p.text || '', ocrConf: p.ocrConf || 0
      };
      bytes += (rec.src ? rec.src.length * 0.75 : 0) + (rec.thumb ? rec.thumb.length * 0.75 : 0);
      await Store.put('pages', rec);
    }
    if (file) {
      await Store.put('files', { id: doc.id, name: name + '.pdf', blob: file });
      bytes += file.size || 0;
      doc.fileId = doc.id;
    }
    doc.bytes = Math.round(bytes);
    await Store.put('docs', doc);
    App.docs = await this.list();
    return doc;
  },
  async pages(docId) {
    const ps = await Store.byDoc(docId);
    return ps.sort((a, b) => a.index - b.index);
  },
  async doc(id) { return Store.get('docs', id); },
  async update(doc) {
    doc.updatedAt = Date.now();
    const ps = await this.pages(doc.id);
    // les PDF importés conservent le nombre de pages lu par pdf.js
    if (doc.kind !== 'pdf' || ps.length) doc.pageCount = ps.length;
    await Store.put('docs', doc);
    App.docs = await this.list();
    return doc;
  },
  async replacePages(docId, pages) {
    const old = await this.pages(docId);
    for (const p of old) await Store.del('pages', p.id);
    let bytes = 0;
    for (let i = 0; i < pages.length; i++) {
      const p = pages[i];
      const rec = {
        id: p.id || uid('pg'), docId, index: i, src: p.src, crop: p.crop || { x: 0, y: 0, w: 1, h: 1 },
        rotate: p.rotate || 0, filter: p.filter || 'none', thumb: p.thumb || null,
        text: p.text || '', ocrConf: p.ocrConf || 0
      };
      bytes += (rec.src || '').length * 0.75 + (rec.thumb || '').length * 0.75;
      await Store.put('pages', rec);
    }
    return Math.round(bytes);
  },
  async file(docId) {
    const f = await Store.get('files', docId);
    return f ? f.blob : null;
  },
  async remove(docId) {
    const ps = await this.pages(docId);
    for (const p of ps) await Store.del('pages', p.id);
    await Store.del('files', docId);
    await Store.del('docs', docId);
    App.docs = await this.list();
  },
  async totalBytes() {
    const docs = await Store.all('docs');
    return docs.reduce((s, d) => s + (d.bytes || 0), 0);
  }
};

/* --------------------------------------------------- OCR : exécution + UI -- */
function ocrOverlay() {
  const sheet = openSheet({
    title: 'Reconnaissance de texte',
    sub: 'Analyse locale dans votre navigateur — aucune image n\'est envoyée sur Internet.',
    body: `<div class="row" style="gap:12px;align-items:center;margin:4px 0 10px">
        <span class="spinner dark" id="ocrSpin"></span>
        <div class="grow"><b id="ocrStatus" style="font-size:13.5px">Préparation…</b>
        <div class="ocr-bar"><i id="ocrBar"></i></div>
        <div class="tiny muted" id="ocrPct">0 %</div></div>
      </div>
      <div class="banner info"><svg class="ico sm"><use href="#i-info"/></svg>
        <span>Le premier lancement télécharge les données de langue (français + anglais) puis les met en cache.</span></div>`,
    actions: [{ label: 'Annuler', cls: 'ghost', act: 'ocr-cancel' }]
  });
  return {
    sheet,
    status(t) { const e = $('#ocrStatus'); if (e) e.textContent = t; },
    progress(p, t) {
      const pct = Math.round(clamp(p, 0, 1) * 100);
      const bar = $('#ocrBar'); if (bar) bar.style.width = pct + '%';
      const lab = $('#ocrPct'); if (lab) lab.textContent = pct + ' %';
      if (t && $('#ocrStatus')) $('#ocrStatus').textContent = t;
    },
    close: closeSheet
  };
}

/** OCR d'une liste de pages (objets {src,crop,rotate,filter}) → [{text, confidence}] */
async function runOcr(pages, langs = Settings.get('ocrLangs')) {
  if (location.protocol === 'file:') {
    // fetch() est interdit sur file:// : les modèles de langue ne peuvent pas être lus.
    const msg = "L'OCR nécessite que ScanPro AI soit servie en http(s) (la prévisualisation live ou " +
      "un petit serveur local comme « python3 -m http.server 8080 »). Ouvert en double-clic (file://), " +
      "le navigateur interdit la lecture des modèles de langue. Le reste de l'app (import, recadrage, PDF) fonctionne.";
    toast(msg, 'err', 9000);
    const s = openSheet({
      title: 'OCR indisponible en mode fichier',
      sub: "Cette page a été ouverte directement depuis le disque (file://).",
      body: `<div class="banner warn">${ICON('i-alert', 'ico sm')}<span>${escapeHtml(msg)}</span></div>
        <p class="small muted">Solutions : ouvrez l'application via la prévisualisation de l'environnement
        (HTTPS) ou lancez un serveur local dans le dossier du projet.</p>
        <div class="ai-out" style="font-size:12.5px">cd scanpro\npython3 -m http.server 8080\n# puis http://localhost:8080/</div>`,
      actions: [{ label: 'Compris', cls: 'primary' }]
    });
    return null;
  }
  const ui = ocrOverlay();
  let cancelled = false;
  const cancelBtn = $('[data-act="ocr-cancel"]', ui.sheet);
  if (cancelBtn) cancelBtn.addEventListener('click', () => { cancelled = true; OCR.terminate(); });
  const results = [];
  try {
    const label = { 'fra+eng': 'français + anglais', fra: 'français', eng: 'anglais' }[langs] || langs;
    ui.status('Chargement du moteur OCR (' + label + ')…');
    await OCR.ensure(langs, (m) => {
      if (cancelled) return;
      if (m && m.status) {
        const map = {
          'loading tesseract core': 'Chargement du moteur…',
          'initializing tesseract': 'Initialisation…',
          'loading language traineddata': 'Téléchargement de la langue (' + label + ')…',
          'loaded language traineddata': 'Langue prête',
          'initializing api': 'Initialisation de l\'API…',
          'recognizing text': 'Reconnaissance du texte…'
        };
        ui.status(map[m.status] || m.status);
        ui.progress(m.progress || 0);
      }
    });
    for (let i = 0; i < pages.length; i++) {
      if (cancelled) throw new Error('annulé');
      ui.status(`Reconnaissance — page ${i + 1}/${pages.length}`);
      ui.progress(0);
      let dataUrl;
      if (typeof pages[i] === 'string') dataUrl = pages[i];
      else {
        const c = await ImageOps.render(pages[i], { maxPx: 2000, quality: 0.95 });
        dataUrl = c.toDataURL('image/jpeg', 0.95);
      }
      const res = await OCR.run(dataUrl, langs, (m) => {
        if (cancelled || !m) return;
        if (m.status === 'recognizing text') {
          ui.progress((i + (m.progress || 0)) / pages.length);
          ui.status(`Reconnaissance — page ${i + 1}/${pages.length}`);
        }
      });
      results.push(res);
      ui.progress((i + 1) / pages.length);
    }
    ui.close();
    return results;
  } catch (err) {
    ui.close();
    if (String(err && err.message).includes('annulé')) { toast('OCR annulé'); return null; }
    console.error('[OCR]', err);
    toast("L'OCR n'a pas pu être effectué : " + (err.message || 'erreur inconnue'), 'err', 6000);
    throw err;
  }
}

/* Point d'entrée de débogage (console) — n'expose aucune donnée à l'extérieur. */
window.ScanPro = {
  get App() { return App; }, get Repo() { return Repo; }, get Settings() { return Settings; },
  get AI() { return AI; }, get Actions() { return Actions; }, Store, PDF, ImageOps,
  version: '1.0.0'
};

/* ------------------------------------------------------- exécution d'acte -- */
const Actions = {};   // rempli par views.js / ui.js

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const name = el.dataset.act;
  if (name === 'ocr-cancel' || name === 'confirm-ok' || name === 'prompt-ok') return; // gérés localement
  const fn = Actions[name];
  if (typeof fn === 'function') {
    e.preventDefault();
    fn(el, e);
  }
});

/* ------------------------------------------------------------- impression -- */
function printPdf(blob) {
  const url = URL.createObjectURL(blob);
  const w = window.open(url, '_blank');
  if (w) { toast('PDF ouvert : utilisez le menu du navigateur → Imprimer', 'ok', 5000); return; }
  const f = document.createElement('iframe');
  f.style.cssText = 'position:fixed;width:0;height:0;border:0;right:0;bottom:0';
  document.body.appendChild(f);
  f.onload = () => {
    try { f.contentWindow.focus(); f.contentWindow.print(); }
    catch (err) { toast("Impression directe bloquée — utilisez « Télécharger » puis imprimer.", 'err', 5000); }
    setTimeout(() => f.remove(), 60000);
  };
  f.src = url;
}

/* ------------------------------------------------------------- utilitaires -- */
async function copyText(text) {
  if (!text) { toast('Rien à copier', 'err'); return false; }
  try {
    if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); }
    else {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
    }
    toast('Texte copié', 'ok');
    return true;
  } catch (e) { toast('Copie impossible sur ce navigateur', 'err'); return false; }
}

async function shareText(text, title = 'Texte reconnu — ScanPro AI') {
  if (!text) { toast('Aucun texte à partager', 'err'); return; }
  if (navigator.share) {
    try { await navigator.share({ title, text }); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  copyText(text);
}

function pdfName(doc, suffix = '') {
  return slugify(doc.name || 'document') + (suffix ? '-' + suffix : '') + '.pdf';
}

/** Génère un PDF pour un document stocké. Retourne {blob, build:boolean} */
async function buildDocPdf(doc, opts = {}) {
  const noMods = !doc.modified;
  if (doc.fileId && noMods) {
    const blob = await Repo.file(doc.id);
    if (blob) return { blob, original: true };
  }
  const pages = await Repo.pages(doc.id);
  if (!pages.length) throw new Error('Ce document ne contient aucune page.');
  const quality = Settings.get('quality') === 'high' ? 0.92 : 0.8;
  const maxPx = Settings.get('quality') === 'high' ? 2400 : 1600;
  const { blob } = await PDF.build(pages, {
    name: doc.name, quality, maxPx,
    onProgress: (p, label) => opts.onProgress && opts.onProgress(p, label)
  });
  return { blob, original: false };
}

</script>
<script>
/* =============================================================================
 * ScanPro AI — vues : Accueil, Documents, Paramètres, Détail document
 * ========================================================================== */
'use strict';

const ICON = (id, cls = 'ico') => `<svg class="${cls}"><use href="#${id}"/></svg>`;

function emptyState({ icon = 'i-folder', title, text, action = '' }) {
  return `<div class="empty"><div class="e-ico">${ICON(icon, 'ico lg')}</div>
    <h3>${escapeHtml(title)}</h3><p>${text}</p>${action}</div>`;
}

function docCard(doc, { compact = false } = {}) {
  const ocrTag = doc.ocr && doc.ocr.status === 'done'
    ? `<span class="tag ok">${ICON('i-check', 'ico sm')} OCR</span>`
    : (doc.ocr && doc.ocr.status === 'failed' ? `<span class="tag warn">OCR échoué</span>` : '');
  const kindTag = doc.kind === 'pdf' ? `<span class="tag blue">PDF importé</span>` : '';
  const thumb = doc.thumb
    ? `<img src="${doc.thumb}" alt="">`
    : `<svg class="ico lg muted"><use href="#i-file"/></svg>`;
  return `<button class="doc-item" data-act="open-doc" data-id="${doc.id}">
    <div class="doc-thumb">${thumb}</div>
    <div class="doc-meta">
      <b>${escapeHtml(doc.name)}</b>
      <div class="meta-line">
        <span>${fmtDate(doc.createdAt)}</span>
        <span>·</span>
        <span>${plural(doc.pageCount || 0, 'page', 'pages')}</span>
        ${compact ? '' : `<span>·</span><span>${fmtBytes(doc.bytes)}</span>`}
      </div>
      <div class="meta-line" style="margin-top:5px">${kindTag}${ocrTag}</div>
    </div>
    <span class="doc-row-actions" role="button" aria-label="Actions" data-act="doc-menu" data-id="${doc.id}">
      ${ICON('i-more', 'ico')}
    </span>
  </button>`;
}

/* =============================== ACCUEIL ================================= */
function viewHome() {
  const docs = App.docs;
  const recent = docs.slice(0, 4);
  const totalPages = docs.reduce((s, d) => s + (d.pageCount || 0), 0);
  const firstName = Settings.get('userName') || '';
  return `
  <header class="appbar">
    <div class="appbar-row">
      <div class="brand">
        <div class="brand-mark"><svg viewBox="0 0 24 24" class="ico"><use href="#i-scan"/></svg></div>
        <div>
          <div class="brand-name">ScanPro AI</div>
          <div class="brand-sub">Scanner & OCR</div>
        </div>
      </div>
      <button class="icon-btn" data-act="go-settings" aria-label="Paramètres">${ICON('i-settings')}</button>
    </div>
    <div class="hello">
      <h2>${firstName ? 'Bonjour ' + escapeHtml(firstName) : 'Prêt à numériser'}</h2>
      <p>Scannez, reconnaissez le texte et exportez en PDF.</p>
    </div>
    <div class="stat-row">
      <div class="stat"><b>${docs.length}</b><span>${docs.length > 1 ? 'documents' : 'document'}</span></div>
      <div class="stat"><b>${totalPages}</b><span>${totalPages > 1 ? 'pages scannées' : 'page scannée'}</span></div>
      <div class="stat"><b>100 %</b><span>local & privé</span></div>
    </div>
    <div class="local-chip">${ICON('i-shield', 'ico sm')} Traitement sur l'appareil</div>
  </header>

  <div class="content">
    <section class="scan-cta">
      <div class="cta-top">
        <div class="cta-badge">${ICON('i-camera', 'ico')}</div>
        <div>
          <h3>Nouveau scan</h3>
          <p>Caméra live, multi-pages, OCR et PDF</p>
        </div>
      </div>
      <button class="btn btn-camera" data-act="scan-camera">
        ${ICON('i-camera', 'ico')} Scanner avec la caméra
      </button>
      <div class="mini-row">
        <button class="btn" data-act="import-image">${ICON('i-image', 'ico sm')} Importer une image</button>
        <button class="btn" data-act="import-pdf">${ICON('i-pdf', 'ico sm')} Importer un PDF</button>
      </div>
    </section>

    <div class="quick-grid">
      <button class="quick" data-act="merge-pdfs">
        <span class="q-ico">${ICON('i-merge', 'ico sm')}</span>
        <span><b>Fusionner des PDF</b><span>2 fichiers ou plus</span></span>
      </button>
      <button class="quick" data-act="go-docs">
        <span class="q-ico">${ICON('i-folder', 'ico sm')}</span>
        <span><b>Mes documents</b><span>${plural(docs.length, 'fichier', 'fichiers')}</span></span>
      </button>
    </div>

    <div class="section-head">
      <h2>Rechercher</h2>
    </div>
    <label class="search">
      ${ICON('i-search')}
      <input id="homeSearch" type="search" placeholder="Nom du document ou texte reconnu…"
        value="${escapeHtml(App.search)}" enterkeyhint="search" autocomplete="off">
      ${App.search ? `<button class="clear" data-act="clear-search" aria-label="Effacer">${ICON('i-x', 'ico sm')}</button>` : ''}
    </label>
    <div id="searchResults">${App.search ? searchResultsHtml(App.search) : ''}</div>

    <div class="section-head">
      <h2>Derniers documents</h2>
      ${docs.length > 4 ? `<button class="link" data-act="go-docs">Tout voir</button>` : ''}
    </div>
    <div class="doc-list">
      ${recent.length
        ? recent.map(d => docCard(d)).join('')
        : emptyState({
            icon: 'i-scan',
            title: 'Aucun document pour l\'instant',
            text: 'Scannez une page ou importez une image pour commencer. Tout reste sur votre téléphone.',
            action: `<button class="btn primary" data-act="scan-camera">${ICON('i-camera', 'ico sm')} Commencer</button>`
          })}
    </div>
    ${docs.length > 4 ? `<button class="btn ghost mt14" data-act="go-docs">Voir les ${docs.length} documents</button>` : ''}
  </div>`;
}

function searchResultsHtml(q) {
  const needle = q.toLowerCase();
  const hits = App.docs.filter(d =>
    (d.name || '').toLowerCase().includes(needle) ||
    (d.text || '').toLowerCase().includes(needle));
  if (!hits.length) {
    return `<div class="banner info mt10">${ICON('i-info', 'ico sm')}
      <span>Aucun résultat pour « ${escapeHtml(q)} ». La recherche porte sur le nom et sur le texte reconnu (OCR).</span></div>`;
  }
  return `<div class="doc-list mt10">${hits.slice(0, 6).map(d => docCard(d, { compact: true })).join('')}</div>`;
}

/* ============================== DOCUMENTS ================================ */
function viewDocs() {
  const filters = [['all', 'Tous'], ['scan', 'Scans'], ['pdf', 'PDF importés'], ['ocr', 'Avec OCR']];
  let docs = App.docs.slice();
  if (App.docFilter === 'scan') docs = docs.filter(d => d.kind !== 'pdf');
  if (App.docFilter === 'pdf') docs = docs.filter(d => d.kind === 'pdf');
  if (App.docFilter === 'ocr') docs = docs.filter(d => d.ocr && d.ocr.status === 'done');
  if (App.search) {
    const n = App.search.toLowerCase();
    docs = docs.filter(d => (d.name || '').toLowerCase().includes(n) || (d.text || '').toLowerCase().includes(n));
  }
  const totalBytes = App.docs.reduce((s, d) => s + (d.bytes || 0), 0);
  return `
  <header class="appbar">

/* ============================ DÉTAIL DOCUMENT ============================ */
function viewDocDetail() {
  const doc = App.doc;
  if (!doc) return emptyState({ icon: 'i-alert', title: 'Document introuvable', text: 'Il a peut-être été supprimé.' });
  const pages = App.docPages;
  const p = pages[App.detailPage] || pages[0];
  const tab = App.detailTab;
  const text = doc.text || '';
  return `
  <header class="appbar">
    <div class="appbar-row">
      <button class="icon-btn" data-act="go-back" aria-label="Retour">${ICON('i-back')}</button>
      <h1>${escapeHtml(doc.name)}</h1>
      <button class="icon-btn" data-act="doc-menu" data-id="${doc.id}" aria-label="Actions du document">${ICON('i-more')}</button>
    </div>
    <div class="row small" style="margin-top:10px;color:#A9BFDF;gap:8px">
      <span>${plural(doc.pageCount || pages.length, 'page', 'pages')}</span><span>·</span>
      <span>${fmtDate(doc.createdAt)}</span><span>·</span>

  <div class="content">
    <div class="detail-tabs">
      <button class="${tab === 'preview' ? 'on' : ''}" data-act="detail-tab" data-tab="preview">${ICON('i-eye')} Aperçu</button>
      <button class="${tab === 'text' ? 'on' : ''}" data-act="detail-tab" data-tab="text">${ICON('i-text')} Texte OCR</button>
      <button class="${tab === 'ai' ? 'on' : ''}" data-act="detail-tab" data-tab="ai">${ICON('i-sparkles')} Assistant IA</button>
    </div>

    ${tab === 'preview' ? previewTab(doc, pages, p) : ''}
    ${tab === 'text' ? textTab(doc, text) : ''}
    ${tab === 'ai' ? aiTab(doc) : ''}

}

function previewTab(doc, pages, p) {

    // PDF importé / fusionné : pas de pages rendues, on affiche la vignette de la 1re page
    return `
    ${doc.thumb

         <div class="preview-nav"><span>Aperçu de la 1<sup>re</sup> page</span>
           <span>${plural(doc.pageCount || 0, 'page', 'pages')}</span></div>`

          <span>Ce PDF de ${plural(doc.pageCount || 0, 'page', 'pages')} est conservé intact.

          partageable et imprimable.</span></div>`}
    <div class="btn-col mt14">
      <button class="btn primary" data-act="doc-pdf-download">${ICON('i-download', 'ico sm')} Télécharger le PDF</button>

      <span><b>PDF importé :</b> il est conservé tel quel (l'original n'est pas réencodé).
      L'OCR page par page des PDF importés et la modification de leurs pages arrivent en V2.</span></div>`;
  }
  return `
  <div class="preview-box">
    <img id="previewImg" src="${p.thumb || p.src}" alt="Aperçu de la page ${App.detailPage + 1}">
  </div>

    <button class="btn xs ghost" data-act="preview-prev" ${App.detailPage <= 0 ? 'disabled' : ''}>${ICON('i-back', 'ico sm')} Préc.</button>
    <span>Page ${App.detailPage + 1} / ${pages.length}</span>
    <button class="btn xs ghost" data-act="preview-next" ${App.detailPage >= pages.length - 1 ? 'disabled' : ''}>Suiv. ${ICON('i-chevron', 'ico sm')}</button>
  </div>
  <div class="btn-col mt14">
    <button class="btn primary" data-act="doc-pdf-download">${ICON('i-download', 'ico sm')} Télécharger le PDF</button>

      <button class="btn ghost" data-act="doc-share-pdf">${ICON('i-share', 'ico sm')} Partager</button>

    <button class="btn ghost" data-act="doc-rename">${ICON('i-edit', 'ico sm')} Renommer</button>
    <button class="btn danger" data-act="doc-delete">${ICON('i-trash', 'ico sm')} Supprimer le document</button>

function textTab(doc, text) {
  const ok = doc.ocr && doc.ocr.status === 'done';
  return `
  ${ok ? '' : `<div class="banner warn">${ICON('i-alert', 'ico sm')}

    et peut prendre quelques secondes par page.</span></div>
    <button class="btn primary mb14" data-act="doc-ocr">${ICON('i-text', 'ico sm')} Extraire le texte (OCR)</button>`}
  <textarea class="textarea" id="ocrEditor" spellcheck="false"
    placeholder="Le texte reconnu apparaîtra ici. Vous pourrez le corriger, le copier et le partager.">${escapeHtml(text)}</textarea>
  <div class="text-meta">
    <span>${text ? plural(text.trim().split(/\s+/).filter(Boolean).length, 'mot', 'mots') + ' · ' + plural(text.length, 'caractère', 'caractères') : 'Aucun texte'}

    <span id="saveHint" class="tiny"></span>

  <div class="btn-row mt10">
    <button class="btn ghost" data-act="text-copy">${ICON('i-copy', 'ico sm')} Copier</button>

  ${ok ? `<div class="row mt14 small muted" style="gap:6px">${ICON('i-info', 'ico sm')}
    <span>Texte extrait le ${fmtDate(doc.ocr.at || doc.createdAt)} · ${doc.ocr.confidence || 0} % de confiance.</span></div>` : ''}`;
}

function aiTab(doc) {
  const text = doc.text || '';
  const hasText = text.trim().length > 40;
  return `
  <div class="ai-note mb14">${ICON('i-alert', 'ico sm')}
    <span><b>Assistant IA — aperçu.</b> Les analyses ci-dessous fonctionnent <b>hors-ligne</b> avec des règles
    déterministes (pas de modèle de langage). Les résumés avancés, l'extraction intelligente de factures et
    la classification fine nécessiteront un serveur ou une clé API : ces fonctions sont marquées
    <span class="soon">À venir</span> et ne prétendent pas fonctionner.</span></div>

  ${hasText ? '' : `<div class="banner warn">${ICON('i-text', 'ico sm')}
    <span>Lancez d'abord l'OCR : l'assistant analyse le texte reconnu.</span></div>
    <button class="btn primary mb14" data-act="doc-ocr">${ICON('i-text', 'ico sm')} Extraire le texte</button>`}

  <div class="ai-card">
    <h4>${ICON('i-sparkles', 'ico sm')} Classification du document
      <span class="tag ok" style="margin-left:auto">Hors-ligne</span></h4>
    <div id="aiClass">${hasText ? '' : '<p class="small muted mb0">Disponible après l\'OCR.</p>'}</div>
